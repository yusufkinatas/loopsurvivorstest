<title>Loop Survivors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=JetBrains+Mono:wght@500;700&family=Unbounded:wght@500;700;800&display=swap">
<style>
/* Loop Survivors. One deliberate dark look: a stage floor at night, lit by six channel colors.
   HUD pieces are styled like hardware: channel strips, rack modules and stomp boxes. */

:root {
  color-scheme: dark;
  --ink: #10120f;
  --panel: #191d17;
  --panel-2: #23291f;
  --line: #343c2e;
  --line-2: #4f5a46;
  --text: #f1f0de;
  --muted: #a4ae99;
  --dim: #79836f;
  --lime: #d0f786;
  --good: #7df0a8;
  --bad: #ff7a8a;
  --gold: #ffd166;
  --beat: #ff5b6b;
  --perc: #ffb547;
  --bass: #9b78ff;
  --chords: #3fcdf5;
  --lead: #55efb3;
  --arp: #ff86d8;
  --f-display: "Unbounded", "Arial Black", "Helvetica Neue", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--ink); color: var(--text); font-family: var(--f-body); overflow: hidden; -webkit-tap-highlight-color: transparent; }
body { -webkit-user-select: none; user-select: none; }
button { font: inherit; }
[hidden] { display: none !important; }

#app { position: fixed; inset: 0; background: var(--ink); }
#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.noscript { position: absolute; inset: 0; display: grid; place-items: center; color: var(--text); }

/* ------------------------------------------------------------------ HUD */

#hud { position: absolute; inset: 0; pointer-events: none; font-family: var(--f-mono); color: var(--text); }

.hud-top {
  position: absolute; top: calc(var(--safe-t) + 12px); left: 16px; right: 16px;
  display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: start; gap: 16px;
}
.hud-bars { display: grid; gap: 6px; width: min(320px, 100%); }
.meter { position: relative; height: 18px; background: rgba(13, 10, 23, 0.72); border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.meter-fill { position: absolute; inset: 0; transform-origin: left center; transform: scaleX(1); transition: transform 0.12s linear; }
.hp .meter-fill { background: linear-gradient(90deg, #e93a5e, #ff8a7a); }
.hp.low { border-color: #ff4d6d; animation: lowhp 0.5s ease-in-out infinite alternate; }
.xp .meter-fill { background: linear-gradient(90deg, var(--chords), var(--lead)); }
.meter-text { position: relative; display: block; padding-left: 8px; font-size: 11px; line-height: 16px; font-weight: 700; font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8); }
@keyframes lowhp { to { box-shadow: 0 0 14px -2px #ff4d6d; } }

.clock { text-align: center; }
.clock-time { display: block; font-family: var(--f-display); font-size: 26px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6); }
.clock-section { display: block; margin-top: 5px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.2em; color: var(--muted); }
.kills { justify-self: end; text-align: right; margin-right: 52px; }
.kills-n { display: block; font-size: 20px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.kills-l { display: block; margin-top: 4px; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }

.pausebtn {
  pointer-events: auto; position: absolute; top: calc(var(--safe-t) + 10px); right: 16px; width: 40px; height: 40px;
  display: grid; place-items: center; padding: 9px; color: var(--text); background: rgba(18, 14, 30, 0.8);
  border: 1px solid var(--line); border-radius: 4px; cursor: pointer;
}
.pausebtn:hover { border-color: var(--line-2); }
.pausebtn:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

.bossbar { position: absolute; top: calc(var(--safe-t) + 74px); left: 50%; transform: translateX(-50%); width: min(560px, calc(100% - 32px)); text-align: center; }
.bossbar-name { display: block; font-family: var(--f-display); font-weight: 700; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 6px; text-shadow: 0 2px 8px #000; }
.bossbar-track { height: 10px; background: rgba(13, 10, 23, 0.8); border: 1px solid var(--line-2); border-radius: 2px; overflow: hidden; }
.bossbar-track { position: relative; }
.bossbar-fill { height: 100%; background: linear-gradient(90deg, #ffffff, var(--c, #d9d4ea)); transform-origin: left center; transition: transform 0.1s linear; }
.bossbar-notch { position: absolute; top: -2px; bottom: -2px; width: 2px; margin-left: -1px; background: rgba(8, 4, 12, 0.9); }
.fightnote { position: absolute; top: calc(var(--safe-t) + 112px); left: 16px; right: 16px; text-align: center; opacity: 0; font-family: var(--f-display); font-size: 15px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; text-shadow: 0 2px 10px #000; }
.fightnote.show { animation: banner 1.8s ease-out forwards; }

.banner { position: absolute; left: 16px; right: 16px; top: 26%; text-align: center; opacity: 0; }
.banner.show { animation: banner 2.8s ease-out forwards; }
.banner-title { font-family: var(--f-display); font-size: clamp(26px, 5.5vw, 54px); font-weight: 800; letter-spacing: 0.03em; text-transform: uppercase; text-wrap: balance; text-shadow: 0 4px 30px rgba(0, 0, 0, 0.7); }
.banner-sub { margin-top: 8px; font-size: 12px; color: var(--muted); letter-spacing: 0.18em; text-transform: uppercase; }
@keyframes banner { 0% { opacity: 0; transform: translateY(10px); } 10% { opacity: 1; transform: none; } 72% { opacity: 1; } 100% { opacity: 0; } }

.hud-side { position: absolute; right: 16px; top: calc(var(--safe-t) + 70px); width: 188px; display: grid; gap: 8px; }
.genre { display: grid; gap: 2px; padding: 8px 10px; background: rgba(18, 14, 30, 0.8); border: 1px solid var(--line); border-radius: 4px; }
.genre-l { font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
.genre-v { font-family: var(--f-display); font-size: 14px; font-weight: 700; }
.chem { display: grid; gap: 3px; }
.chem-row { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 8px; padding: 4px 10px; font-size: 11px; background: rgba(18, 14, 30, 0.7); border: 1px solid var(--line); border-radius: 3px; color: var(--muted); }
.chem-row.active { color: var(--text); border-color: color-mix(in srgb, var(--s) 45%, var(--line)); }
.chem-name { color: var(--s); font-weight: 700; letter-spacing: 0.06em; }
.chem-count { font-variant-numeric: tabular-nums; }
.chem-dots { display: flex; gap: 3px; }
.chem-dots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255, 255, 255, 0.14); }
.chem-dots i.on { background: var(--s); box-shadow: 0 0 6px var(--s); }
.seqgrid { width: 100%; height: 80px; padding: 6px; background: rgba(13, 10, 23, 0.72); border: 1px solid var(--line); border-radius: 4px; }

.hud-bottom {
  position: absolute; left: 16px; right: 16px; bottom: calc(var(--safe-b) + 12px);
  display: flex; align-items: flex-end; justify-content: center; gap: 12px;
}
.dropmeter {
  pointer-events: auto; position: relative; flex: 0 0 150px; height: 48px; padding: 0 10px; overflow: hidden;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  color: var(--text); background: rgba(18, 14, 30, 0.86); border: 1px solid var(--line); border-radius: 4px;
  font: 700 12px/1 var(--f-mono); letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer;
}
.dropmeter:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.dropmeter-fill { position: absolute; inset: 0; transform-origin: left center; transform: scaleX(0); background: linear-gradient(90deg, rgba(255, 209, 102, 0.18), rgba(255, 209, 102, 0.5)); }
.dropmeter-label, .dropmeter kbd { position: relative; }
.dropmeter kbd { font: inherit; font-size: 9.5px; padding: 3px 5px; border: 1px solid var(--line-2); border-radius: 3px; color: var(--muted); }
.dropmeter.ready { border-color: var(--gold); color: var(--gold); animation: dropready 0.5s ease-in-out infinite alternate; }
.dropmeter.building { border-color: #fff; color: #fff; }
@keyframes dropready { from { box-shadow: 0 0 0 0 rgba(255, 209, 102, 0.2); } to { box-shadow: 0 0 26px 0 rgba(255, 209, 102, 0.55); } }

.mixwrap { display: grid; gap: 4px; min-width: 0; }
.mixcap { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); text-shadow: 0 1px 3px #000; }
.mixcap b { color: var(--text); }
.mixer { display: grid; grid-template-columns: repeat(6, minmax(0, 140px)); gap: 6px; min-width: 0; }
.strip {
  display: grid; grid-template-columns: 5px 22px minmax(0, 1fr); grid-template-rows: auto auto; column-gap: 7px; row-gap: 4px;
  padding: 7px 8px 7px 6px; background: rgba(18, 14, 30, 0.86); border: 1px solid var(--line); border-radius: 4px; min-width: 0;
}
.strip-meter { grid-row: 1 / span 2; position: relative; overflow: hidden; border-radius: 2px; background: rgba(255, 255, 255, 0.07); }
.strip-meter i { position: absolute; inset: 0; background: var(--c); transform-origin: bottom center; transform: scaleY(0); box-shadow: 0 0 8px var(--c); }
.strip-icon { grid-row: 1 / span 2; align-self: center; width: 22px; height: 22px; color: var(--c); }
.strip-icon svg { width: 100%; height: 100%; }
.strip-body { display: grid; min-width: 0; }
.strip-name { font-size: 11px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.strip-sub { font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.strip-pips { grid-column: 3; display: flex; gap: 3px; }
.strip-pips i { width: 9px; height: 3px; border-radius: 1px; background: rgba(255, 255, 255, 0.14); }
.strip-pips i.on { background: var(--c); }
.strip.empty { opacity: 0.55; }
.strip.empty:not(.locked) .strip-sub { color: var(--c); }
.strip.locked { opacity: 0.32; border-style: dashed; }
.strip.empty .strip-icon { color: var(--dim); }
.strip.empty .strip-name { color: var(--muted); }

.pedalboard { display: grid; grid-template-columns: repeat(2, 44px); grid-auto-rows: 22px; gap: 4px; }
.pedal { display: grid; place-items: center; align-content: center; gap: 2px; border-radius: 3px; border: 1px solid var(--line); background: rgba(18, 14, 30, 0.86); font-size: 8.5px; font-weight: 700; letter-spacing: 0.06em; }
.pedal:not(.empty) { border-color: color-mix(in srgb, var(--c) 60%, var(--line)); color: var(--c); }
.pedal.empty { border-style: dashed; }
.pedal-pips { display: flex; gap: 2px; }
.pedal-pips i { width: 4px; height: 2px; background: rgba(255, 255, 255, 0.2); }
.pedal-pips i.on { background: var(--c); }
.pedal-name { line-height: 1; }

#stick { position: fixed; left: 0; top: 0; width: 112px; height: 112px; border-radius: 50%; border: 2px solid rgba(243, 238, 255, 0.28); background: rgba(243, 238, 255, 0.04); pointer-events: none; z-index: 2; }
#stick span { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(243, 238, 255, 0.34); }

.tip {
  position: absolute; left: 50%; bottom: calc(var(--safe-b) + 84px); transform: translateX(-50%);
  max-width: calc(100% - 32px); padding: 8px 14px; font-family: var(--f-body); font-size: 14px; font-weight: 600;
  color: var(--text); background: rgba(18, 14, 30, 0.88); border: 1px solid var(--line-2); border-radius: 4px;
  text-align: center; animation: screenIn 0.25s ease-out;
}

/* ------------------------------------------------------------------ the live set */
#screens {
  position: absolute; inset: 0; z-index: 3; overflow-y: auto; overscroll-behavior: contain;
  padding: calc(var(--safe-t) + 32px) 36px calc(var(--safe-b) + 32px);
  background: rgba(13, 17, 12, .89); -webkit-user-select: none; user-select: none;
  scrollbar-width: thin; scrollbar-color: var(--line-2) var(--ink);
}
#screens:has(.screen-title) {
  background: radial-gradient(ellipse at 82% 42%, rgba(111, 136, 67, .09), transparent 54%), #10130f;
}
#screens:has(.screen-title)::before {
  content: ''; position: fixed; inset: 0; pointer-events: none; opacity: .18;
  background-image: linear-gradient(#4d5e3a 1px, transparent 1px), linear-gradient(90deg, #4d5e3a 1px, transparent 1px);
  background-size: 64px 64px; mask-image: linear-gradient(90deg, transparent 40%, #000);
}
body[data-screen] #hud .hud-top, body[data-screen] #hud .hud-side, body[data-screen] #hud .banner, body[data-screen] #hud .tip, body[data-screen] #hud .pausebtn { visibility: hidden; }
.screen { min-height: 100%; display: grid; place-items: center; position: relative; }
.screen:not(.screen-title) { animation: screenIn .2s ease-out; }
@keyframes screenIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
h2 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(25px, 3.4vw, 40px); line-height: 1.16; letter-spacing: -.035em; text-wrap: balance; }
.kicker { margin: 0 0 12px; font: 500 10px/1.5 var(--f-mono); letter-spacing: .19em; text-transform: uppercase; color: var(--lime); }
.sub { margin: 12px 0 0; color: var(--muted); font-size: 15px; line-height: 1.6; max-width: 64ch; }
.btn { min-height: 46px; padding: 13px 21px; font: 600 14px/1.15 var(--f-body); color: var(--text); background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 5px; cursor: pointer; transition: border-color .15s, background .15s, transform .15s; }
.btn:hover { background: #30392a; border-color: var(--muted); }
.btn:active { transform: translateY(1px); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--lime); outline-offset: 4px; }
.btn-primary { background: var(--lime); color: #17200e; border-color: var(--lime); font-weight: 700; }
.btn-primary:hover { background: #dfff9f; border-color: #dfff9f; box-shadow: 0 0 28px #d0f71a16; }
.btn-ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn-ghost:hover { color: var(--text); border-color: var(--line); background: transparent; }
.btn[disabled] { opacity: .4; cursor: default; }
.muted { color: var(--dim); font-weight: 400; }

/* A live-show poster: oversized type, an orbital waveform, and a record shelf. */
.title-wrap { width: min(1232px, 100%); margin: auto; position: relative; }
.title-masthead { display: flex; align-items: center; justify-content: space-between; padding: 0 0 23px; border-bottom: 1px solid var(--line); color: var(--muted); font: 500 10px/1.4 var(--f-mono); letter-spacing: .16em; }
.masthead-brand { color: var(--text); display: flex; align-items: center; gap: 10px; }
.masthead-brand i { display: inline-block; width: 15px; height: 15px; border: 1px solid var(--lime); border-radius: 50%; box-shadow: inset 0 0 0 4px #10130f, inset 0 0 0 8px var(--lime); }
.masthead-edition > span { margin: 0 12px; color: var(--line-2); }
.title-hero { display: grid; grid-template-columns: 1.1fr 1fr; gap: 30px; align-items: center; padding: 50px 0 46px; }
.title-copy { position: relative; z-index: 1; }
.title-label { margin: 0 0 21px; display: flex; align-items: center; gap: 12px; color: var(--muted); font: 500 9px/1.6 var(--f-mono); letter-spacing: .13em; }
.title-label > span { color: var(--lime); padding: 4px 7px; border: 1px solid #53683b; line-height: 1; }
.logo { margin: 0; display: grid; width: fit-content; font-family: "Arial Black", "Helvetica Neue", Arial, sans-serif; font-weight: 900; line-height: .8; letter-spacing: -.085em; }
.logo-main { position: relative; font-size: clamp(90px, 11vw, 155px); }
.logo-star { display: inline-block; color: var(--lime); font-family: Arial, sans-serif; font-weight: 500; font-size: .48em; margin-left: .18em; vertical-align: top; line-height: .6; }
.logo-sub { margin-top: 15px; font-size: clamp(35px, 4.55vw, 64px); letter-spacing: -.06em; line-height: 1; }
.tagline { margin: 29px 0 0; font: 600 clamp(21px, 2.2vw, 30px)/1.25 var(--f-body); letter-spacing: -.035em; }
.tagline em { font-style: normal; color: var(--lime); }
.title-description { margin: 15px 0 0; color: var(--muted); font-size: 14px; line-height: 1.65; }
.title-actions { display: flex; gap: 10px; margin-top: 25px; }
.btn-play { display: flex; justify-content: space-between; align-items: center; width: 244px; min-height: 56px; padding: 15px 20px; font-size: 17px; }
.btn-play span:last-child { font-size: 25px; font-weight: 400; }
.btn-icon { width: 56px; min-height: 56px; padding: 17px; background: transparent; }
.btn-icon svg { display: block; width: 100%; height: 100%; }
.title-subactions { display: flex; align-items: center; gap: 24px; margin-top: 14px; }
.title-subactions button { padding: 0; background: none; border: 0; color: var(--muted); font: 500 12px/1.5 var(--f-body); cursor: pointer; }
.title-subactions button:hover { color: var(--lime); }
.title-subactions button span { margin-left: 7px; }
.headphones { color: var(--dim); font: 500 8px/1.5 var(--f-mono); letter-spacing: .06em; }
.stage-art { max-width: 500px; justify-self: end; width: 100%; position: relative; }
.stage-art svg { width: 100%; display: block; overflow: visible; }
.art-topline, .art-bottomline { display: flex; justify-content: space-between; align-items: center; color: var(--dim); font: 500 8px/1.5 var(--f-mono); letter-spacing: .15em; }
.art-topline { padding: 0 10px; }
.art-bottomline { padding: 8px 10px 0; justify-content: center; gap: 10px; }
.mini-wave { color: var(--lime); font-size: 11px; letter-spacing: 2px; margin-left: auto; }
.signal-dot { width: 5px; height: 5px; background: var(--lime); border-radius: 50%; box-shadow: 0 0 9px #d0f78666; }
.disc-orbit { transform-origin: 250px 250px; animation: discSpin 70s linear infinite; }
@keyframes discSpin { to { transform: rotate(360deg); } }
.title-bottom { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; padding: 25px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.title-best { display: grid; grid-template-columns: 1fr; gap: 5px; align-content: center; }
.title-best > span { font: 500 8px/1.5 var(--f-mono); letter-spacing: .12em; color: var(--dim); }
.title-best > span:first-child { color: var(--muted); }
.title-best b { font-size: 19px; letter-spacing: -.02em; font-weight: 600; }
.career-summary { display: flex; align-items: center; gap: 16px; text-align: left; padding: 13px 18px; color: var(--text); background: #1b2117; border: 1px solid #3b4533; border-radius: 5px; cursor: pointer; transition: background .15s, border-color .15s; }
.career-summary:hover { background: #242e1d; border-color: #687a51; }
.career-summary > span:last-child { margin-left: auto; color: var(--lime); font-size: 22px; }
.career-icon { color: var(--lime); font: 400 37px/1 Arial, sans-serif; }
.career-summary b { display: block; font-size: 13px; font-weight: 600; }
.career-summary small { display: block; margin-top: 7px; font: 500 9px/1.5 var(--f-mono); color: var(--muted); }
.career-summary small i { font-style: normal; margin: 0 5px; color: var(--line-2); }
.channel-line { display: flex; justify-content: space-between; gap: 30px; align-items: center; padding-top: 22px; }
.channel-line-label, .channel-line-end { font: 500 8px/1.6 var(--f-mono); color: var(--dim); letter-spacing: .08em; }
.channel-line-end { text-align: right; }
.channel-line > div { display: flex; justify-content: center; gap: 23px; }
.channel-line > div > span { display: flex; align-items: center; gap: 7px; font: 600 9px/1.2 var(--f-mono); color: var(--c); text-transform: uppercase; }
.channel-line i { font-style: normal; font-size: 8px; color: var(--dim); }

/* Screen panels and sound-check instructions. */
.panel { width: min(520px, 100%); padding: 34px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 30px 100px -30px #000b; }
.panel-wide { width: min(820px, 100%); }
.panel-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 25px; }
.panel-actions.col { flex-direction: column; }
.panel-actions.col .btn { width: 100%; }
.howto { margin: 23px 0 0; padding-left: 23px; display: grid; gap: 13px; line-height: 1.6; font-size: 13px; color: var(--muted); }
.howto b { color: var(--text); }
.howto li::marker { font-family: var(--f-mono); color: var(--lime); }
.roles { list-style: none; margin: 24px 0 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.roles li { display: grid; grid-template-columns: 26px 1fr; column-gap: 10px; align-items: center; padding: 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel-2); font-size: 12px; }
.roles li b { color: var(--c); font-family: var(--f-mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
.roles li span:last-child { grid-column: 2; color: var(--muted); margin-top: 3px; line-height: 1.4; }
.ht-icon { grid-row: 1 / span 2; width: 26px; height: 26px; color: var(--c); }
.field { display: grid; gap: 12px; margin-top: 28px; font-size: 14px; }
.field input[type=range] { width: 100%; accent-color: var(--lime); }
.toggle { display: flex; align-items: center; gap: 12px; margin-top: 20px; font-size: 14px; cursor: pointer; }
.toggle input { width: 18px; height: 18px; accent-color: var(--lime); }

/* Instruments are modules, with the pattern printed on the faceplate. */
.cards-wrap { width: min(1080px, 100%); text-align: left; margin: auto; padding: 16px 0 24px; }
.cards-wrap > .kicker, .cards-wrap > h2, .cards-wrap > .sub { text-align: center; margin-left: auto; margin-right: auto; }
.select-caption { display: flex; justify-content: space-between; margin-top: 38px; padding-bottom: 12px; border-bottom: 1px solid var(--line); color: var(--dim); font: 500 8px/1.5 var(--f-mono); letter-spacing: .1em; }
.select-caption > span:last-child { display: flex; align-items: center; gap: 6px; }
kbd { font: inherit; }
.select-caption kbd { display: inline-block; color: var(--muted); border: 1px solid var(--line-2); padding: 2px 4px; border-radius: 2px; line-height: 1; }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; margin-top: 20px; text-align: left; }
.row-actions { display: flex; justify-content: center; gap: 10px; margin-top: 20px; }
.card { position: relative; display: flex; flex-direction: column; gap: 11px; padding: 25px 23px 0; min-width: 0; color: var(--text); background: linear-gradient(150deg, color-mix(in srgb, var(--c) 6%, var(--panel)), var(--panel) 65%); border: 1px solid var(--line-2); border-radius: 6px; cursor: pointer; text-align: left; transition: transform .15s ease-out, border-color .15s, box-shadow .15s; overflow: hidden; }
.card::before { content: ''; position: absolute; left: 0; top: 0; right: 0; height: 3px; background: var(--c); opacity: .65; }
.card:hover, .card:focus-visible, .card.focused, .card.listening { transform: translateY(-5px); border-color: var(--c); box-shadow: 0 0 0 1px color-mix(in srgb, var(--c) 40%, transparent), 0 20px 40px -25px var(--c); outline: none; }
.card-key { position: absolute; top: 21px; right: 18px; font: 500 10px/1 var(--f-mono); color: var(--dim); border: 1px solid var(--line-2); border-radius: 3px; padding: 4px 5px; }
.card-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-right: 22px; min-height: 33px; }
.eyebrow { font: 500 9px/1.4 var(--f-mono); letter-spacing: .11em; text-transform: uppercase; color: var(--c); }
.badge { font: 500 8px/1.2 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--s); border: 1px solid color-mix(in srgb, var(--s) 35%, transparent); padding: 3px 6px; border-radius: 3px; }
.card-head { display: flex; flex-direction: column; align-items: flex-start; gap: 19px; margin-top: 10px; }
.card-icon { display: grid; place-items: center; width: 58px; height: 58px; padding: 12px; color: var(--c); background: color-mix(in srgb, var(--c) 8%, transparent); border: 1px solid color-mix(in srgb, var(--c) 25%, transparent); border-radius: 50%; }
.card-icon svg { width: 100%; height: 100%; }
.card-title { font-family: var(--f-display); font-size: 21px; font-weight: 700; letter-spacing: -.035em; line-height: 1.25; text-wrap: balance; }
.card-tag { font: 500 10px/1.4 var(--f-mono); color: var(--c); opacity: .85; }
.pips { display: flex; gap: 4px; padding: 1px 0 3px; }
.pips i { flex: 0 0 22px; height: 3px; border-radius: 1px; background: #ffffff17; }
.pips i.on { background: var(--c); }
.pips i.cur { box-shadow: 0 0 8px color-mix(in srgb, var(--c) 35%, transparent); }
.card-body { font-size: 14px; line-height: 1.55; min-height: 43px; }
.card-detail { font-size: 11.5px; line-height: 1.6; color: var(--muted); }
.steps { display: grid; gap: 4px; padding: 13px 0 3px; margin-top: auto; }
.steps-row { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 3px; }
.steps i { height: 12px; border-radius: 1px; background: #ffffff08; }
.steps i.beat { background: #ffffff14; }
.steps i.on { background: var(--c); opacity: calc(.45 + var(--v) * .55); }
.steps i.new { box-shadow: inset 0 0 0 1.5px #fff; }
.chem-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; font: 500 10px/1.5 var(--f-mono); }
.chem-list li { color: var(--muted); }
.chem-list li.good { color: var(--good); }
.chem-list li.good::before { content: '+ '; }
.chem-list li.bad { color: var(--bad); }
.chem-list li.bad::before { content: '− '; }
.card-listen { display: none; font: 500 9px/1.4 var(--f-mono); color: var(--dim); letter-spacing: .08em; text-transform: uppercase; }
.card-pick { display: flex; justify-content: space-between; align-items: center; margin: 7px -23px 0; padding: 15px 23px; background: color-mix(in srgb, var(--c) 5%, transparent); border-top: 1px solid var(--line); color: var(--muted); font: 600 11px/1.3 var(--f-body); }
.card-pick > span:last-child { color: var(--c); font-size: 20px; line-height: 1; }
.card:hover .card-pick, .card.focused .card-pick { color: var(--text); background: color-mix(in srgb, var(--c) 12%, transparent); }
@media (hover: none) { .card-listen { display: block; } .card-key, .dropmeter kbd, .select-caption > span:last-child { display: none; } }

/* Your set, pressed to a record. */
.end-heading { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
.end h2 { font-size: clamp(38px, 5vw, 56px); }
.end-stamp { display: block; padding: 8px 10px; border: 1px solid #798c5c; color: var(--lime); font: 600 9px/1.5 var(--f-mono); text-align: center; letter-spacing: .12em; transform: rotate(7deg); }
.end-score { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-top: 28px; padding-bottom: 22px; border-bottom: 1px dashed var(--line-2); }
.end-score > div { display: grid; gap: 9px; }
.end-score > div > span { font: 500 9px/1.5 var(--f-mono); color: var(--muted); letter-spacing: .12em; }
.end-score i { display: inline-block; font-style: normal; color: var(--lime); margin-left: 8px; }
.end-score b { font-family: var(--f-display); font-size: clamp(32px, 4.5vw, 49px); line-height: 1; font-weight: 700; letter-spacing: -.04em; color: var(--lime); font-variant-numeric: tabular-nums; }
.end-score-note { font: 500 8px/1.8 var(--f-mono); color: var(--dim); text-align: right; letter-spacing: .04em; }
.end-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 20px; }
.end-stats div { display: grid; gap: 6px; padding: 12px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 3px; }
.end-stats b { font-family: var(--f-display); font-size: 20px; font-variant-numeric: tabular-nums; letter-spacing: -.04em; }
.end-stats span { font: 500 8px/1.5 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.end-highlights { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; padding: 12px 0 20px; border-bottom: 1px solid var(--line); color: var(--dim); font: 500 9px/1.5 var(--f-mono); }
.end-highlights b { color: var(--muted); }
.end-genre { display: flex; justify-content: space-between; gap: 10px; margin: 21px 0 0; font-size: 12px; color: var(--muted); }
.end-genre b { color: var(--text); font-family: var(--f-display); font-size: 12px; font-weight: 500; }
.end-rows { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 10px; }
.end-rows li { display: grid; grid-template-columns: 24px minmax(0, 150px) minmax(0, 1fr) 68px; align-items: center; gap: 10px; font-size: 12px; }
.end-rows li.retired { opacity: .55; }
.er-icon { width: 22px; height: 22px; color: var(--c); }
.er-name { display: grid; line-height: 1.4; min-width: 0; }
.er-name small { font: 500 8px/1.5 var(--f-mono); color: var(--dim); letter-spacing: .03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.er-bar { height: 6px; background: #ffffff09; border-radius: 1px; overflow: hidden; }
.er-bar i { display: block; height: 100%; background: var(--c); transform-origin: left center; }
.er-num { text-align: right; font: 500 10px/1.3 var(--f-mono); font-variant-numeric: tabular-nums; color: var(--muted); }
.end-pedals { margin: 15px 0 0; font: 500 9px/1.5 var(--f-mono); color: var(--dim); }
.new-records { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px; margin-top: 18px; border: 1px solid #667d47; background: #d0f78609; border-radius: 3px; }
.new-records > span { color: var(--lime); font: 500 8px/1.5 var(--f-mono); letter-spacing: .1em; margin-right: auto; }
.new-records > b { font-size: 11px; font-weight: 600; }
.panel-collection { width: min(940px, 100%); }
.collection-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 30px 0; padding: 19px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.collection-stats > div { display: grid; gap: 4px; }
.collection-stats b { color: var(--lime); font: 700 27px/1.3 var(--f-display); letter-spacing: -.04em; }
.collection-stats small { font-size: 15px; color: var(--dim); }
.collection-stats span { font: 500 9px/1.5 var(--f-mono); color: var(--muted); }
.record-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 13px; }
.record-card { padding: 18px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel-2); position: relative; }
.record-disc { display: grid; place-items: center; width: 62px; height: 62px; margin-bottom: 20px; border: 1px solid var(--line-2); border-radius: 50%; background: repeating-radial-gradient(#1c2219 0px, #1c2219 2px, #303a27 3px, #1c2219 4px); box-shadow: 0 7px 15px #0003; }
.record-disc i { width: 23px; height: 23px; border-radius: 50%; background: var(--dim); border: 8px solid #58624f; }
.record-number { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 5px; font: 500 7px/1.5 var(--f-mono); color: var(--dim); letter-spacing: .04em; }
.record-card h3 { margin: 10px 0 0; font-size: 15px; font-weight: 600; }
.record-card p { margin: 7px 0 0; font-size: 11px; line-height: 1.6; color: var(--muted); }
.record-card.earned { border-color: #657c45; background: linear-gradient(140deg, #34422a55, var(--panel-2)); }
.earned .record-disc i { background: #1c2219; border-color: var(--lime); }
.earned .record-number > span { color: var(--lime); }
.locked .record-disc { opacity: .55; }
.locked h3 { color: var(--muted); }

/* ------------------------------------------------------------------ small screens */
@media (max-width: 1100px) {
  .title-hero { gap: 15px; }
  .channel-line > div { gap: 15px; }
  .channel-line-end { display: none; }
  .logo-main { font-size: 13vw; }
  .logo-sub { font-size: 5.35vw; }
}

  .card-detail { font-size: 11px; }

}
@media (max-width: 760px) {

  .clock { justify-self: end; margin-right: 50px; text-align: right; }
  .clock-time { font-size: 20px; }
  .hud-bars { width: 100%; }
  .hud-side { top: calc(var(--safe-t) + 60px); left: 16px; right: auto; width: auto; }

  .strip { grid-template-columns: 4px minmax(0, 1fr); padding: 5px; row-gap: 3px; }
  .strip-body { display: none; }
  .strip-icon { grid-row: 1; grid-column: 2; justify-self: center; width: 20px; height: 20px; }
  .strip-pips { grid-column: 2; justify-content: center; gap: 2px; }
  .strip-pips i { width: 5px; }
  .dropmeter { flex: 1 1 auto; max-width: 220px; height: 44px; }
  .pedalboard { grid-template-columns: repeat(4, 40px); grid-auto-rows: 26px; }
  .tip { bottom: calc(var(--safe-b) + 128px); font-size: 13px; }
  #screens { padding: calc(var(--safe-t) + 22px) 20px calc(var(--safe-b) + 22px); }
  .title-masthead { padding-bottom: 18px; font-size: 8px; letter-spacing: .09em; }
  .masthead-edition { font-size: 7px; }

  .title-hero { grid-template-columns: 1fr; padding: 30px 0 27px; }
  .title-copy { z-index: 1; }
  .title-label { margin-bottom: 23px; font-size: 7px; }
  .logo-main { font-size: clamp(96px, 23vw, 155px); }
  .logo-sub { font-size: clamp(39px, 9.5vw, 64px); margin-top: 10px; }
  .logo-star { font-size: .43em; }
  .tagline { margin-top: 24px; font-size: 25px; }
  .title-description { font-size: 12px; margin-top: 11px; }
  .title-actions { margin-top: 22px; }
  .title-subactions { justify-content: space-between; gap: 8px; }
  .title-subactions button { font-size: 11px; }
  .headphones { font-size: 7px; }
  .stage-art { position: absolute; width: 205px; top: 195px; right: -42px; opacity: .22; pointer-events: none; z-index: 0; }
  .art-topline, .art-bottomline { display: none; }
  .title-bottom { grid-template-columns: 1fr; gap: 18px; padding: 20px 0; }
  .title-best { grid-template-columns: auto 1fr; column-gap: 15px; row-gap: 4px; }
  .title-best > span:first-child { grid-column: 1; align-self: center; font-size: 7px; max-width: 83px; }
  .title-best b { grid-column: 2; font-size: 15px; text-align: right; }
  .title-best > span:last-child { grid-column: 1 / -1; font-size: 7px; }
  .career-summary { padding: 12px 14px; gap: 12px; }
  .career-summary b { font-size: 12px; }
  .career-summary small { font-size: 8px; }
  .career-icon { font-size: 30px; }
  .channel-line { gap: 13px; padding-top: 18px; }

  .channel-line > div > span { font-size: 7px; gap: 5px; }

  .cards-wrap { padding: 8px 0; }
  .cards-wrap h2 { font-size: 27px; }
  .cards-wrap .kicker { font-size: 8px; margin-bottom: 9px; }
  .cards-wrap .sub { font-size: 12px; line-height: 1.5; margin-top: 10px; }
  .select-caption { margin-top: 23px; font-size: 6.5px; padding-bottom: 9px; }
  .cards { grid-template-columns: minmax(0, 1fr); margin-top: 13px; gap: 12px; }
  .card { padding: 15px 15px 0; gap: 6px; }
  .card-key { top: 14px; right: 14px; }
  .card-top { min-height: 17px; padding-right: 30px; }
  .card-head { flex-direction: row; align-items: center; gap: 10px; margin-top: 5px; }
  .card-icon { flex: 0 0 37px; width: 37px; height: 37px; padding: 8px; border-radius: 50%; }
  .card-title { font-size: 17px; }
  .card-tag { font-size: 8px; margin-left: 47px; margin-top: -9px; }

  .card-head { padding-bottom: 4px; }
  .pips { position: absolute; top: 20px; right: 39px; padding: 0; gap: 2px; }

  .card-detail { font-size: 10px; line-height: 1.4; }
  .steps { padding-top: 4px; }
  .steps i { height: 6px; }
  .chem-list { font-size: 9px; gap: 2px; }
  .card-listen { display: none !important; }
  .card-pick { margin: 5px -15px 0; padding: 9px 15px; font-size: 10px; }
  .card-pick > span:last-child { font-size: 16px; }
  .row-actions { margin-top: 12px; }
  .panel { padding: 25px 22px; }
  .roles { grid-template-columns: 1fr; }
  .howto { font-size: 12px; gap: 11px; }
  .end-stats { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; }
  .end-stats div { padding: 10px 6px; }
  .end-stats b { font-size: 15px; }
  .end-stats span { font-size: 6.5px; letter-spacing: .02em; }

}

/* Performance controls stay readable while the song fills the arena. */
.transport { position: absolute; top: calc(var(--safe-t) + 70px); left: 50%; transform: translateX(-50%); width: min(320px, 34vw); }
.song-path { display: flex; gap: 4px; height: 4px; }
.song-path i { flex: 1; background: #ffffff16; border-radius: 2px; }
.song-path i.past { background: #c5f27766; }
.song-path i.current { background: #d8fa75; box-shadow: 0 0 10px #d8fa7530; }
.transport-readout { display: flex; justify-content: space-between; gap: 8px; align-items: center; margin-top: 8px; }
.transport-next { font-size: 9px; color: var(--muted); letter-spacing: .04em; }
.beat-lights { display: flex; gap: 5px; }
.beat-lights i { width: 5px; height: 5px; border-radius: 50%; background: #ffffff20; }
.beat-lights i.on { background: #d8fa75; box-shadow: 0 0 6px #d8fa7570; }
.groove-meter { position: absolute; top: calc(var(--safe-t) + 82px); left: 18px; width: 158px; color: var(--muted); }
.groove-label { display: block; font-size: 8px; line-height: 1.4; letter-spacing: .18em; }
.groove-count { display: flex; align-items: baseline; gap: 8px; margin-top: 3px; }
.groove-count b { font-family: var(--f-display); font-size: 26px; color: var(--text); font-variant-numeric: tabular-nums; }
.groove-count span { font-size: 9px; }
.groove-count strong { margin-left: auto; font-size: 22px; color: #d8fa75; }
.groove-track { height: 2px; background: #ffffff13; margin: 5px 0 6px; overflow: hidden; }
.groove-track i { display: block; height: 100%; background: var(--muted); transform-origin: left; }
.groove-help { display: block; font-size: 8px; line-height: 1.5; letter-spacing: .03em; }
.groove-meter.active .groove-label, .groove-meter.active .groove-count b { color: #d8fa75; }
.groove-meter.active .groove-track i { background: #d8fa75; }
.power-status { width: max-content; margin-top: 8px; padding: 4px 6px; border: 1px solid #ffd16666; border-radius: 3px; background: #191d17e8; color: var(--gold); font-size: 8px; letter-spacing: .03em; }
.spotlight-objective { position: absolute; top: calc(var(--safe-t) + 208px); left: 18px; width: 226px; padding: 11px 12px; background: #151b13e8; border: 1px solid #d0f78666; border-radius: 4px; }
.spotlight-heading, .spotlight-readout { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.spotlight-heading b { font-size: 10px; color: var(--lime); }
.spotlight-time { font-size: 9px; color: var(--muted); font-variant-numeric: tabular-nums; }
.spotlight-track { height: 4px; margin: 10px 0 8px; background: #ffffff16; border-radius: 2px; overflow: hidden; }
.spotlight-track i { display: block; height: 100%; background: var(--lime); transform-origin: left; }
.spotlight-readout { font-size: 8px; color: var(--muted); }
.spotlight-progress { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
.spotlight-reward { display: block; margin-top: 9px; font-size: 7px; line-height: 1.5; letter-spacing: .04em; color: var(--lime); }
.spotlight-objective.holding { border-color: var(--lime); box-shadow: 0 0 20px #d0f78614; }
.spotlight-objective.holding .spotlight-action { color: var(--text); }
.spotlight-objective.urgent .spotlight-time { color: var(--gold); }
.remix-rack { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; min-height: 18px; font-size: 8px; }
.remix-label { color: var(--muted); font-size: 7px; letter-spacing: .08em; margin-right: 2px; }
.remix-empty { color: var(--muted); font-size: 8px; }
.remix-badge { display: block; padding: 3px 6px; color: var(--c); background: #11170fe8; border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); border-radius: 3px; line-height: 1.2; }
.remix-slots { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 22px; }
.remix-slots span { min-width: 130px; padding: 8px 12px; text-align: center; font: 500 9px/1.4 var(--f-mono); letter-spacing: .04em; color: var(--dim); border: 1px dashed var(--line-2); border-radius: 3px; }
.remix-slots .next { color: var(--lime); border-color: var(--lime); border-style: solid; background: #d0f78609; }
.remix-slots .filled { color: var(--text); border-style: solid; }
.remix-draft .select-caption { margin-top: 24px; }
.card-remix .card-body { font-weight: 600; }
.card-remix .card-detail { flex: 1; }
.current-build { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); }
.current-build h3 { display: flex; justify-content: space-between; gap: 10px; margin: 0 0 10px; font: 600 10px/1.5 var(--f-mono); color: var(--text); text-transform: uppercase; letter-spacing: .06em; }
.current-build h3 span { color: var(--muted); font-size: 8px; font-weight: 400; text-align: right; }
.build-channels { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 20px; }
.build-channels > span { padding: 5px 7px; color: var(--c); background: var(--panel-2); border-radius: 3px; font-size: 11px; }
.build-channels b { color: var(--muted); margin-left: 5px; font-size: 9px; font-weight: 400; }
.build-empty { color: var(--muted); font-size: 12px; margin: 0; }
.build-remixes { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; }
.build-remixes li { padding: 6px 8px; color: var(--c); background: var(--panel-2); border-left: 2px solid var(--c); border-radius: 2px; }
.build-remixes b { font-size: 11px; font-weight: 600; }
.build-remixes.detailed { display: grid; gap: 7px; }
.build-remixes.detailed li { display: grid; gap: 4px; padding: 8px 10px; }
.build-remixes.detailed span { color: var(--muted); font-size: 11px; line-height: 1.5; }
.end-remixes { margin-top: 17px; }
.end-remixes > span { display: block; margin-bottom: 8px; font: 500 8px/1.5 var(--f-mono); letter-spacing: .1em; color: var(--muted); }
body[data-screen] #hud .spotlight-objective, body[data-screen] #hud .groove-meter, body[data-screen] #hud .transport { visibility: hidden; }
.abilities { flex: 0 0 150px; display: grid; gap: 6px; }
.abilities .dropmeter { width: 100%; height: 42px; }
.dashmeter { pointer-events: auto; position: relative; isolation: isolate; display: flex; align-items: center; justify-content: space-between; overflow: hidden; gap: 6px; width: 100%; min-height: 38px; padding: 0 10px; color: var(--muted); background: #10140fe8; border: 1px solid #ffffff22; border-radius: 4px; font: 700 10px var(--f-mono); text-transform: uppercase; cursor: pointer; }
.dashmeter-fill { position: absolute; inset: 0; z-index: -1; transform-origin: left; background: #d8fa7517; }
.dashmeter.ready { color: #d8fa75; border-color: #d8fa7566; }
.dashmeter.perfect { color: #fff; border-color: #fff; }
.dashmeter kbd { font: inherit; font-size: 8px; border: 1px solid #ffffff30; border-radius: 3px; padding: 3px; }
.dashmeter:focus-visible { outline: 2px solid #d8fa75; outline-offset: 3px; }
.bossbar { top: calc(var(--safe-t) + 110px); }
.fightnote { top: calc(var(--safe-t) + 152px); }
@media (max-width: 1050px) and (min-width: 761px) {
  .abilities { flex-basis: 126px; }
  .dashmeter { font-size: 9px; }
  .hud-bottom { gap: 8px; }
}
@media (max-width: 760px) {
  .transport { top: calc(var(--safe-t) + 102px); width: calc(100% - 32px); }
  .groove-meter { top: calc(var(--safe-t) + 58px); left: auto; right: 18px; width: 116px; }
  .groove-label, .groove-help { display: none; }
  .groove-count b { font-size: 20px; }
  .groove-count strong { font-size: 18px; }
  .groove-count span { font-size: 8px; }
  .groove-track { margin: 3px 0; }
  .power-status { position: absolute; top: 27px; right: 0; margin: 0; padding: 2px 4px; font-size: 6px; }
  .spotlight-objective { top: calc(var(--safe-t) + 140px); left: 16px; width: calc(100% - 32px); padding: 9px 11px; }
  .spotlight-heading b { font-size: 10px; }
  .spotlight-track { margin: 7px 0 6px; }
  .spotlight-reward { margin-top: 6px; font-size: 7px; }
  .bossbar { top: calc(var(--safe-t) + 140px); }
  .has-spotlight .bossbar { top: calc(var(--safe-t) + 238px); }
  .fightnote { top: calc(var(--safe-t) + 180px); font-size: 12px; }
  .has-spotlight .fightnote { top: calc(var(--safe-t) + 278px); }
  .abilities { flex: 1 1 200px; max-width: none; grid-template-columns: 1fr 1fr; gap: 6px; }
  .abilities .dropmeter, .dashmeter { height: 44px; min-height: 44px; padding: 0 9px; font-size: 10px; }
  .abilities kbd { display: none; }
  .pedalboard { grid-template-columns: repeat(4, 28px); gap: 3px; }
  .pedal-name { font-size: 7px; }
  .tip { bottom: calc(var(--safe-b) + 160px); }
  .remix-rack { gap: 4px; min-height: 18px; }
  .remix-badge { padding: 3px 5px; font-size: 7px; }
  .remix-slots { gap: 5px; margin-top: 16px; }
  .remix-slots span { min-width: 0; flex: 1; padding: 7px 5px; font-size: 7px; }
  .remix-draft .select-caption { margin-top: 17px; }
  .current-build h3 { font-size: 9px; }
  .current-build h3 span { font-size: 7px; }
}
@media (max-height: 500px) and (min-width: 761px) {
  .hud-side { display: none; }
  .groove-meter { top: 65px; }
  .groove-help, .groove-label { display: none; }
  .power-status { position: absolute; top: 33px; left: 0; margin: 0; padding: 2px 4px; font-size: 7px; }
  .spotlight-objective { top: 123px; width: 206px; padding: 8px 10px; }
  .spotlight-heading b { font-size: 9px; }
  .spotlight-track { margin: 7px 0 6px; }
  .spotlight-reward { margin-top: 6px; font-size: 6px; }
  .bossbar { width: 280px; }
  .fightnote { left: 235px; right: 235px; font-size: 10px; }
  .tip { bottom: calc(var(--safe-b) + 126px); font-size: 11px; }
  .cards-wrap > h2 { font-size: 27px; }
  .cards-wrap > .sub { font-size: 12px; margin-top: 9px; }
  .card { gap: 7px; padding-top: 16px; }
  .card-head { flex-direction: row; align-items: center; gap: 9px; margin-top: 2px; }
  .card-icon { width: 36px; height: 36px; flex: 0 0 36px; padding: 7px; }
  .card-title { font-size: 15px; }
  .card-body { font-size: 12px; }
  .card-detail { font-size: 10px; }
  #screens:has(.remix-draft) { padding-top: 12px; padding-bottom: 12px; }
  .remix-draft { padding: 0; }
  .remix-draft > .kicker { font-size: 8px; margin-bottom: 6px; }
  .remix-draft > h2 { font-size: 24px; }
  .remix-draft > .sub { font-size: 11px; margin-top: 5px; }
  .remix-draft .remix-slots { margin-top: 10px; }
  .remix-draft .remix-slots span { padding: 5px 10px; font-size: 8px; }
  .remix-draft .select-caption { margin-top: 10px; padding-bottom: 6px; font-size: 7px; }
  .remix-draft .cards { margin-top: 10px; }
  .remix-draft .card { gap: 5px; padding: 12px 14px 0; }
  .remix-draft .card-top { min-height: 12px; }
  .remix-draft .card-key { top: 10px; right: 12px; font-size: 8px; }
  .remix-draft .eyebrow { font-size: 8px; }
  .remix-draft .card-head { margin-top: 0; }
  .remix-draft .card-icon { width: 32px; height: 32px; flex-basis: 32px; }
  .remix-draft .card-title { font-size: 14px; }
  .remix-draft .card-tag { font-size: 8px; }
  .remix-draft .card-body { min-height: 0; font-size: 11px; line-height: 1.4; }
  .remix-draft .card-detail { font-size: 9px; line-height: 1.4; }
  .remix-draft .card-pick { margin: 5px -14px 0; padding: 8px 14px; font-size: 10px; }
}
