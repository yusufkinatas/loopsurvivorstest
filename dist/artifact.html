<title>Loop Survivors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=JetBrains+Mono:wght@500;700&family=Unbounded:wght@500;700;800&display=swap">
<style>
/* Loop Survivors. One deliberate dark look: a stage floor at night, lit by six channel colors.
   HUD pieces are styled like hardware: channel strips, rack modules and stomp boxes. */

:root {
  color-scheme: dark;
  --ink: #0d0a17;
  --panel: #161125;
  --panel-2: #1f1836;
  --line: #2f2650;
  --line-2: #43386b;
  --text: #f3eeff;
  --muted: #a89fc8;
  --dim: #6d6592;
  --good: #7df0a8;
  --bad: #ff7a8a;
  --gold: #ffd166;
  --beat: #ff5b6b;
  --perc: #ffb547;
  --bass: #9b78ff;
  --chords: #3fcdf5;
  --lead: #55efb3;
  --arp: #ff86d8;
  --f-display: "Unbounded", "Arial Black", "Helvetica Neue", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--ink); color: var(--text); font-family: var(--f-body); overflow: hidden; -webkit-tap-highlight-color: transparent; }
body { -webkit-user-select: none; user-select: none; }
button { font: inherit; }
[hidden] { display: none !important; }

#app { position: fixed; inset: 0; background: var(--ink); }
#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.noscript { position: absolute; inset: 0; display: grid; place-items: center; color: var(--text); }

/* ------------------------------------------------------------------ HUD */

#hud { position: absolute; inset: 0; pointer-events: none; font-family: var(--f-mono); color: var(--text); }

.hud-top {
  position: absolute; top: calc(var(--safe-t) + 12px); left: 16px; right: 16px;
  display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: start; gap: 16px;
}
.hud-bars { display: grid; gap: 6px; width: min(320px, 100%); }
.meter { position: relative; height: 18px; background: rgba(13, 10, 23, 0.72); border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.meter-fill { position: absolute; inset: 0; transform-origin: left center; transform: scaleX(1); transition: transform 0.12s linear; }
.hp .meter-fill { background: linear-gradient(90deg, #e93a5e, #ff8a7a); }
.hp.low { border-color: #ff4d6d; animation: lowhp 0.5s ease-in-out infinite alternate; }
.xp .meter-fill { background: linear-gradient(90deg, var(--chords), var(--lead)); }
.meter-text { position: relative; display: block; padding-left: 8px; font-size: 11px; line-height: 16px; font-weight: 700; font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8); }
@keyframes lowhp { to { box-shadow: 0 0 14px -2px #ff4d6d; } }

.clock { text-align: center; }
.clock-time { display: block; font-family: var(--f-display); font-size: 26px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6); }
.clock-section { display: block; margin-top: 5px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.2em; color: var(--muted); }

/* Song map (hud.js songMapHtml): the whole song as one strip of sections, a red tick where each boss arrives. */
.songmap { position: relative; display: flex; gap: 2px; width: clamp(150px, 18vw, 240px); height: 6px; margin: 7px auto 0; }
.songmap i { position: relative; border-radius: 1px; background: color-mix(in srgb, var(--h) 30%, rgba(255, 255, 255, 0.08)); }
.songmap i.done { background: var(--h); }
.songmap i.boss::before { content: ""; position: absolute; left: 0; top: -3px; bottom: -3px; width: 2px; background: #ff4d6d; }
.songmap b { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: #fff; box-shadow: 0 0 6px #fff; }
.songmap b span { position: absolute; left: 1px; transform: translateX(calc(var(--a) * -100%)); font: 700 10px/1 var(--f-mono); letter-spacing: 0.12em; text-transform: uppercase; white-space: nowrap; }
.songmap b.you span { bottom: calc(100% + 5px); color: var(--text); }
.songmap b.best { width: 0; background: none; box-shadow: none; border-left: 2px dashed var(--text); }
.songmap b.best span { top: calc(100% + 5px); color: var(--muted); }
.kills { justify-self: end; text-align: right; margin-right: 52px; }
.kills-n { display: block; font-size: 20px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.kills-l { display: block; margin-top: 4px; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }

.pausebtn {
  pointer-events: auto; position: absolute; top: calc(var(--safe-t) + 10px); right: 16px; width: 40px; height: 40px;
  display: grid; place-items: center; padding: 9px; color: var(--text); background: rgba(18, 14, 30, 0.8);
  border: 1px solid var(--line); border-radius: 4px; cursor: pointer;
}
.pausebtn:hover { border-color: var(--line-2); }
.pausebtn:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

.bossbar { position: absolute; top: calc(var(--safe-t) + 86px); left: 50%; transform: translateX(-50%); width: min(560px, calc(100% - 400px)); text-align: center; }   /* clears the side column */
.bossbar-name { display: block; font-family: var(--f-display); font-weight: 700; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 6px; text-shadow: 0 2px 8px #000; }
.bossbar-track { height: 10px; background: rgba(13, 10, 23, 0.8); border: 1px solid var(--line-2); border-radius: 2px; overflow: hidden; }
.bossbar-track { position: relative; }
.bossbar-fill { height: 100%; background: linear-gradient(90deg, #ffffff, var(--c, #d9d4ea)); transform-origin: left center; transition: transform 0.1s linear; }
.bossbar-notch { position: absolute; top: -2px; bottom: -2px; width: 2px; margin-left: -1px; background: rgba(8, 4, 12, 0.9); }
/* Damage chip: the health just lost stays white under the fill for a moment, then catches up. */
.bossbar-chip { position: absolute; inset: 0; background: rgba(255, 255, 255, 0.6); transform-origin: left center; transition: transform 0.35s ease-out; }
.bossbar-fill { position: relative; }
.fightnote { position: absolute; top: calc(var(--safe-t) + 124px); left: 16px; right: 16px; text-align: center; opacity: 0; font-family: var(--f-display); font-size: 15px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; text-shadow: 0 2px 10px #000; }
.fightnote.show { animation: banner 1.8s ease-out forwards; }

.banner { position: absolute; left: 16px; right: 16px; top: 26%; text-align: center; opacity: 0; }
.banner.show { animation: banner 2.8s ease-out forwards; }
.banner-title { font-family: var(--f-display); font-size: clamp(26px, 5.5vw, 54px); font-weight: 800; letter-spacing: 0.03em; text-transform: uppercase; text-wrap: balance; text-shadow: 0 4px 30px rgba(0, 0, 0, 0.7); }
.banner-sub { margin-top: 8px; font-size: 12px; color: var(--muted); letter-spacing: 0.18em; text-transform: uppercase; }
@keyframes banner { 0% { opacity: 0; transform: translateY(10px); } 10% { opacity: 1; transform: none; } 72% { opacity: 1; } 100% { opacity: 0; } }

.hud-side { position: absolute; right: 16px; top: calc(var(--safe-t) + 70px); width: 188px; display: grid; gap: 8px; }
.genre { display: grid; gap: 2px; padding: 8px 10px; background: rgba(18, 14, 30, 0.8); border: 1px solid var(--line); border-radius: 4px; }
.genre-l { font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
.genre-v { font-family: var(--f-display); font-size: 14px; font-weight: 700; }
.chem { display: grid; gap: 3px; }
.chem-row { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 8px; padding: 4px 10px; font-size: 11px; background: rgba(18, 14, 30, 0.7); border: 1px solid var(--line); border-radius: 3px; color: var(--muted); }
.chem-row.active { color: var(--text); border-color: color-mix(in srgb, var(--s) 45%, var(--line)); }
.chem-name { color: var(--s); font-weight: 700; letter-spacing: 0.06em; }
.chem-count { font-variant-numeric: tabular-nums; }
.chem-dots { display: flex; gap: 3px; }
.chem-dots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255, 255, 255, 0.14); }
.chem-dots i.on { background: var(--s); box-shadow: 0 0 6px var(--s); }
.seqgrid { width: 100%; height: 80px; padding: 6px; background: rgba(13, 10, 23, 0.72); border: 1px solid var(--line); border-radius: 4px; }

.hud-bottom {
  position: absolute; left: 16px; right: 16px; bottom: calc(var(--safe-b) + 12px);
  display: flex; align-items: flex-end; justify-content: center; gap: 12px;
}
.dropmeter {
  pointer-events: auto; position: relative; flex: 0 0 150px; height: 48px; padding: 0 10px; overflow: hidden;
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  color: var(--text); background: rgba(18, 14, 30, 0.86); border: 1px solid var(--line); border-radius: 4px;
  font: 700 12px/1 var(--f-mono); letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer;
}
.dropmeter:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.dropmeter-fill { position: absolute; inset: 0; transform-origin: left center; transform: scaleX(0); background: linear-gradient(90deg, rgba(255, 209, 102, 0.18), rgba(255, 209, 102, 0.5)); }
.dropmeter-label, .dropmeter kbd { position: relative; }
.dropmeter kbd { font: inherit; font-size: 9.5px; padding: 3px 5px; border: 1px solid var(--line-2); border-radius: 3px; color: var(--muted); }
.dropmeter.ready { border-color: var(--gold); color: var(--gold); animation: dropready 0.5s ease-in-out infinite alternate; }
.dropmeter.building { border-color: #fff; color: #fff; }
@keyframes dropready { from { box-shadow: 0 0 0 0 rgba(255, 209, 102, 0.2); } to { box-shadow: 0 0 26px 0 rgba(255, 209, 102, 0.55); } }

.mixwrap { display: grid; gap: 4px; min-width: 0; }
.mixcap { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); text-shadow: 0 1px 3px #000; }
.mixcap b { color: var(--text); }
.mixer { display: grid; grid-template-columns: repeat(6, minmax(0, 160px)); gap: 6px; min-width: 0; }
.strip {
  display: grid; grid-template-columns: 5px 22px minmax(0, 1fr); grid-template-rows: auto auto; column-gap: 7px; row-gap: 4px;
  padding: 7px 8px 7px 6px; background: rgba(18, 14, 30, 0.86); border: 1px solid var(--line); border-radius: 4px; min-width: 0;
}
.strip-meter { grid-row: 1 / span 2; position: relative; overflow: hidden; border-radius: 2px; background: rgba(255, 255, 255, 0.07); }
.strip-meter i { position: absolute; inset: 0; background: var(--c); transform-origin: bottom center; transform: scaleY(0); box-shadow: 0 0 8px var(--c); }
.strip-icon { grid-row: 1 / span 2; align-self: center; width: 22px; height: 22px; color: var(--c); }
.strip-icon svg { width: 100%; height: 100%; }
.strip-body { display: grid; min-width: 0; }
.strip-name { font-size: 11px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.strip-sub { font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.strip-pips { grid-column: 3; display: flex; gap: 3px; }
.strip-pips i { width: 9px; height: 3px; border-radius: 1px; background: rgba(255, 255, 255, 0.14); }
.strip-pips i.on { background: var(--c); }
.strip.remix { border-color: color-mix(in srgb, var(--gold) 55%, var(--line)); }
.strip.remix .strip-name { color: var(--gold); }
.strip.remix .strip-pips i.on { background: var(--gold); box-shadow: 0 0 5px var(--gold); }
.strip.empty { opacity: 0.55; }
.strip.empty:not(.locked) .strip-sub { color: var(--c); }
.strip.locked { opacity: 0.32; border-style: dashed; }
.strip.empty .strip-icon { color: var(--dim); }
.strip.empty .strip-name { color: var(--muted); }

.pedalboard { display: grid; grid-template-columns: repeat(2, 44px); grid-auto-rows: 22px; gap: 4px; }
.pedal { display: grid; place-items: center; align-content: center; gap: 2px; border-radius: 3px; border: 1px solid var(--line); background: rgba(18, 14, 30, 0.86); font-size: 8.5px; font-weight: 700; letter-spacing: 0.06em; }
.pedal:not(.empty) { border-color: color-mix(in srgb, var(--c) 60%, var(--line)); color: var(--c); }
.pedal.empty { border-style: dashed; }
.pedal-pips { display: flex; gap: 2px; }
.pedal-pips i { width: 4px; height: 2px; background: rgba(255, 255, 255, 0.2); }
.pedal-pips i.on { background: var(--c); }
.pedal-name { line-height: 1; }

#stick { position: fixed; left: 0; top: 0; width: 112px; height: 112px; border-radius: 50%; border: 2px solid rgba(243, 238, 255, 0.28); background: rgba(243, 238, 255, 0.04); pointer-events: none; z-index: 2; }
#stick span { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(243, 238, 255, 0.34); }

.tip {
  position: absolute; left: 50%; bottom: calc(var(--safe-b) + 84px); transform: translateX(-50%);
  max-width: calc(100% - 32px); padding: 8px 14px; font-family: var(--f-body); font-size: 14px; font-weight: 600;
  color: var(--text); background: rgba(18, 14, 30, 0.88); border: 1px solid var(--line-2); border-radius: 4px;
  text-align: center; animation: screenIn 0.25s ease-out;
}

/* ------------------------------------------------------------------ screens */

#screens {
  position: absolute; inset: 0; z-index: 3; overflow-y: auto; overscroll-behavior: contain;
  padding: calc(var(--safe-t) + 16px) 16px calc(var(--safe-b) + 16px);
  background: radial-gradient(ellipse at 50% 40%, rgba(13, 10, 23, 0.35), rgba(13, 10, 23, 0.82));
  -webkit-user-select: none; user-select: none;
}
#screens:has(.screen-levelup, .screen-pause, .screen-end, .screen-howto, .screen-settings) { background: rgba(11, 8, 20, 0.84); }
body[data-screen] #hud .hud-top, body[data-screen] #hud .hud-side, body[data-screen] #hud .banner, body[data-screen] #hud .tip, body[data-screen] #hud .pausebtn, body[data-screen] #hud .bossbar, body[data-screen] #hud .fightnote, body[data-screen] #hud .mixcap { visibility: hidden; }
.screen { min-height: 100%; display: grid; place-items: center; }
.screen-levelup, .screen-pause, .screen-end, .screen-howto, .screen-settings { animation: screenIn 0.18s ease-out; }
@keyframes screenIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

h2 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(22px, 3.6vw, 32px); line-height: 1.15; text-wrap: balance; }
.kicker { margin: 0 0 8px; font-family: var(--f-mono); font-size: 11.5px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
.sub { margin: 8px 0 0; color: var(--muted); font-size: 14.5px; line-height: 1.5; max-width: 60ch; }

.btn {
  min-height: 44px; padding: 12px 20px; font: 600 15px/1 var(--f-body); color: var(--text);
  background: rgba(22, 17, 37, 0.8); border: 1px solid var(--line-2); border-radius: 4px; cursor: pointer;
  transition: border-color 0.12s, background 0.12s, transform 0.12s, opacity 0.15s;
}
.btn:hover { border-color: var(--muted); }
.btn:active { transform: translateY(1px); }
.btn:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
.btn-primary { background: var(--text); color: var(--ink); border-color: var(--text); }
.btn-primary:hover { background: #ffffff; border-color: #ffffff; }
.btn-ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn-ghost:hover { color: var(--text); border-color: var(--line); }
.btn[disabled] { opacity: 0.4; cursor: default; }
.muted { color: var(--dim); font-weight: 400; }
body[data-input=pad] #screens :is(.btn, input):focus { outline: 2px solid var(--text); outline-offset: 2px; }

/* Title: the logo is a step sequencer. A playhead lights each letter in turn, one 16th note apart. */
.title-wrap { display: grid; justify-items: center; text-align: center; gap: 18px; }
.logo { display: grid; justify-items: center; line-height: 0.9; }
.logo-row { display: flex; gap: 0.02em; font-family: var(--f-display); font-weight: 800; font-size: clamp(46px, 12vw, 128px); letter-spacing: 0.01em; }
.logo-row-b { font-size: clamp(26px, 6.7vw, 72px); letter-spacing: 0.06em; }
.logo-row span { color: var(--text); animation: step 2s steps(1, end) infinite; animation-delay: calc(var(--i) * 0.125s); }
.logo-row span:nth-child(6n + 1) { --lc: var(--beat); }
.logo-row span:nth-child(6n + 2) { --lc: var(--perc); }
.logo-row span:nth-child(6n + 3) { --lc: var(--bass); }
.logo-row span:nth-child(6n + 4) { --lc: var(--chords); }
.logo-row span:nth-child(6n + 5) { --lc: var(--lead); }
.logo-row span:nth-child(6n + 6) { --lc: var(--arp); }
@keyframes step { 0% { color: var(--lc); text-shadow: 0 0 28px var(--lc); } 6.25% { color: var(--text); text-shadow: none; } }
.tagline { margin: 0; font-size: clamp(16px, 2.2vw, 20px); color: var(--text); max-width: 34ch; text-wrap: balance; }
.title-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 6px; }
.best { margin: 0; font-family: var(--f-mono); font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }
.title-wrap .career { margin-top: -12px; color: var(--dim); text-wrap: balance; }
.hint { margin: 0; font-family: var(--f-mono); font-size: 11px; color: var(--dim); letter-spacing: 0.14em; text-transform: uppercase; }

/* Panels */
.panel { width: min(520px, 100%); padding: 26px 24px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 30px 80px -30px rgba(0, 0, 0, 0.8); }
.panel-wide { width: min(780px, 100%); }
.panel-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.panel-actions.col { flex-direction: column; }
.panel-actions.col .btn { width: 100%; }

.howto { margin: 16px 0 0; padding-left: 22px; display: grid; gap: 10px; line-height: 1.5; font-size: 15px; max-width: 70ch; }
.howto b { color: var(--text); }
.howto li::marker { font-family: var(--f-mono); color: var(--dim); }
.roles { list-style: none; margin: 18px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 8px; }
.roles li { display: grid; grid-template-columns: 26px 1fr; column-gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel-2); font-size: 13px; }
.roles li b { color: var(--c); font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
.roles li span:last-child { grid-column: 2; color: var(--muted); }
.ht-icon { grid-row: 1 / span 2; width: 26px; height: 26px; color: var(--c); }
.keys { width: 100%; margin-top: 14px; border-collapse: collapse; font-size: 13.5px; }
.keys th, .keys td { padding: 3px 12px 3px 0; text-align: left; border-bottom: 1px solid var(--line); }
.keys thead th { font: 700 10.5px/1.4 var(--f-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.keys tbody th { font-weight: 600; }
.keys td { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.touch-note { display: none; margin: 14px 0 0; font-size: 14.5px; line-height: 1.5; color: var(--muted); }
body[data-input=touch] .keys { display: none; }
body[data-input=touch] .touch-note { display: block; }

.field { display: grid; gap: 8px; margin-top: 18px; font-size: 14px; }
.field input[type=range] { width: 100%; accent-color: var(--chords); }
.toggle { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 15px; cursor: pointer; }
.toggle input { width: 18px; height: 18px; accent-color: var(--chords); }

/* Cards: rack modules. */
.cards-wrap { width: min(980px, 100%); display: grid; justify-items: center; text-align: center; align-self: start; margin-top: max(0px, calc(50vh - 300px)); }
.cards { width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 300px)); justify-content: center; gap: 16px; margin-top: 22px; text-align: left; }
.row-actions { display: flex; gap: 10px; margin-top: 18px; }
.card {
  position: relative; display: flex; flex-direction: column; gap: 9px; padding: 18px 16px 16px; min-width: 0;
  color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; text-align: left;
  transition: transform 0.12s ease-out, border-color 0.12s, box-shadow 0.12s, opacity 0.15s;
}
/* A level-up arms after a moment (screens.js ARM_MS): until then its cards and buttons are dimmed and ignore presses. */
.arming .card, .arming .row-actions .btn:not([disabled]) { opacity: 0.6; }
.card::before, .card::after { content: ""; position: absolute; top: 7px; width: 5px; height: 5px; border-radius: 50%; background: var(--line-2); }
.card::before { left: 7px; }
.card::after { right: 7px; top: auto; bottom: 7px; }
.card:hover, .card:focus-visible, .card.focused, .card.listening { transform: translateY(-3px); border-color: var(--c); box-shadow: 0 0 0 1px var(--c), 0 18px 44px -20px var(--c); outline: none; }
.card-key { position: absolute; top: 12px; right: 12px; font-family: var(--f-mono); font-size: 11px; color: var(--dim); border: 1px solid var(--line); border-radius: 3px; padding: 2px 6px; line-height: 1; }
.card-top { display: flex; align-items: center; gap: 8px; padding-right: 30px; }
