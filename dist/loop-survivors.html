<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loop Survivors</title>
<meta name="description" content="A survival action game where your weapons are sounds. Every attack is a note, and your build becomes the song.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=JetBrains+Mono:wght@500;700&family=Unbounded:wght@500;700;800&display=swap">
<style>
/* Loop Survivors. One deliberate dark look: a stage floor at night, lit by six channel colors.
   HUD pieces are styled like hardware: channel strips and stomp boxes. Play shows glyphs and motion, not
   sentences; the words live on the pause sheet and in the card info layer. */

:root {
  color-scheme: dark;
  --ink: #0d0a17;
  --panel: #161125;
  --panel-2: #1f1836;
  --line: #2f2650;
  --line-2: #43386b;
  --text: #f3eeff;
  --muted: #a89fc8;
  --dim: #6d6592;
  --good: #7df0a8;
  --bad: #ff7a8a;
  --gold: #ffd166;
  --beat: #b6f23a;
  --perc: #ffb547;
  --bass: #9b78ff;
  --chords: #3fcdf5;
  --lead: #55efb3;
  --arp: #ff86d8;
  --f-display: "Unbounded", "Arial Black", "Helvetica Neue", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--ink); color: var(--text); font-family: var(--f-body); overflow: hidden; -webkit-tap-highlight-color: transparent; }
body { -webkit-user-select: none; user-select: none; }
button { font: inherit; }
[hidden] { display: none !important; }
svg { display: block; width: 100%; height: 100%; }

#app { position: fixed; inset: 0; background: var(--ink); }
#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.noscript { position: absolute; inset: 0; display: grid; place-items: center; color: var(--text); }

/* Key caps are drawn from data-k, so prompts stay glyphs. They follow the device used last (input.js sets
   body[data-input] to key, mouse, touch or pad). */
kbd[data-k]::after, .card-key::after { content: attr(data-k); }
kbd { font: 700 9px/1 var(--f-mono); color: var(--muted); padding: 2px 4px; border: 1px solid var(--line-2); border-radius: 3px; background: rgba(13, 10, 23, 0.85); }
body[data-input=touch] .card-key, body[data-input=touch] .k-key, body[data-input=pad] .k-key, body:not([data-input=pad]) .k-pad { display: none; }

/* ------------------------------------------------------------------ HUD */

#hud { position: absolute; inset: 0; pointer-events: none; color: var(--text); }

.hud-top {
  position: absolute; top: calc(var(--safe-t) + 14px); left: 16px; right: 16px;
  display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: start; gap: 16px;
}
.hud-bars { display: grid; gap: 4px; width: min(300px, 100%); }
.meter { position: relative; background: rgba(13, 10, 23, 0.72); border-radius: 3px; overflow: hidden; }
.meter.hp { height: 10px; border: 1px solid var(--line); }
.meter.xp { height: 4px; border-radius: 2px; }
.meter-fill { position: absolute; inset: 0; transform-origin: left center; transform: scaleX(1); transition: transform 0.12s linear; }
.hp .meter-fill { background: linear-gradient(90deg, #e93a5e, #ff8a7a); }
.hp.low { border-color: #ff4d6d; animation: lowhp 0.5s ease-in-out infinite alternate; }
.xp .meter-fill { background: linear-gradient(90deg, var(--chords), var(--lead)); transform: scaleX(0); }
@keyframes lowhp { to { box-shadow: 0 0 14px -2px #ff4d6d; } }

/* Song map (hud.js songMapHtml): the whole song as one strip of sections, a red tick where each boss arrives. */
.songmap { position: relative; display: flex; gap: 2px; width: clamp(150px, 18vw, 240px); height: 6px; margin: 7px auto 0; }
.songmap i { position: relative; border-radius: 1px; background: color-mix(in srgb, var(--h) 30%, rgba(255, 255, 255, 0.08)); }
.songmap i.done { background: var(--h); }
.songmap i.boss::before { content: ""; position: absolute; left: 0; top: -3px; bottom: -3px; width: 2px; background: #ff4d6d; }
.songmap b { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: #fff; box-shadow: 0 0 6px #fff; }
.songmap b span { position: absolute; left: 1px; transform: translateX(calc(var(--a) * -100%)); font: 700 10px/1 var(--f-mono); letter-spacing: 0.12em; text-transform: uppercase; white-space: nowrap; }
.songmap b.you span { bottom: calc(100% + 5px); color: var(--text); }
.songmap b.best { width: 0; background: none; box-shadow: none; border-left: 2px dashed var(--text); }
.songmap b.best span { top: calc(100% + 5px); color: var(--muted); }
/* The HUD's song map is promoted: wider, with a bright playhead and a dot where the next channel opens. */
.songwrap .songmap { width: clamp(220px, 28vw, 380px); height: 8px; margin: 1px auto 0; }
.songwrap .songmap b.head { top: -5px; bottom: -5px; width: 3px; margin-left: -1.5px; border-radius: 2px; box-shadow: 0 0 8px #fff, 0 0 16px rgba(255, 255, 255, 0.6); }
.songwrap .songmap b.open { top: 50%; bottom: auto; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 50%; background: var(--ink); border: 2px solid #fff; box-shadow: 0 0 6px #fff; animation: ledfree 1s ease-in-out infinite alternate; }

.pausebtn {
  pointer-events: auto; position: absolute; top: calc(var(--safe-t) + 8px); right: 12px; width: 40px; height: 40px;
  display: none; place-items: center; padding: 9px; color: var(--text); background: rgba(18, 14, 30, 0.8);
  border: 1px solid var(--line); border-radius: 4px; cursor: pointer;
}
body[data-input=touch] .pausebtn { display: grid; }
.pausebtn:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

/* The Drop's thumb button: touch only, and only while the meter is full (keys and pads press Space or A). */
.dropbtn {
  pointer-events: auto; position: absolute; right: 18px; bottom: calc(var(--safe-b) + 96px); width: 64px; height: 64px;
  display: none; place-items: center; padding: 16px; color: var(--ink); background: #fff; border: 0; border-radius: 50%;
  box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.25), 0 0 26px rgba(255, 255, 255, 0.55); cursor: pointer; animation: dropready 0.5s ease-in-out infinite alternate;
}
body[data-input=touch] #hud.drop-ready .dropbtn { display: grid; }
@keyframes dropready { from { transform: scale(1); } to { transform: scale(1.07); } }

.bossbar { position: absolute; top: calc(var(--safe-t) + 44px); left: 50%; transform: translateX(-50%); width: min(520px, calc(100% - 32px)); text-align: center; }
.bossbar-name { display: block; font-family: var(--f-display); font-weight: 700; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 6px; text-shadow: 0 2px 8px #000; }
.bossbar-track { position: relative; height: 10px; background: rgba(13, 10, 23, 0.8); border: 1px solid var(--line-2); border-radius: 2px; overflow: hidden; }
.bossbar-fill { position: relative; height: 100%; background: linear-gradient(90deg, #ffffff, var(--c, #d9d4ea)); transform-origin: left center; transition: transform 0.1s linear; }
.bossbar-notch { position: absolute; top: -2px; bottom: -2px; width: 2px; margin-left: -1px; background: rgba(8, 4, 12, 0.9); z-index: 1; }
/* A notch White Noise has passed breaks: a red gap. */
.bossbar-notch.broken { width: 6px; margin-left: -3px; background: #ff4d6d; box-shadow: 0 0 10px #ff4d6d; animation: notchbreak 0.5s ease-out; }
@keyframes notchbreak { 0% { transform: scaleY(2.4); background: #fff; } 100% { transform: none; } }
/* Damage chip: the health just lost stays white under the fill for a moment, then catches up. */
.bossbar-chip { position: absolute; inset: 0; background: rgba(255, 255, 255, 0.6); transform-origin: left center; transition: transform 0.35s ease-out; }
/* Knocked off the beat by the Drop: the bar shakes and flashes white. */
.bossbar.stagger .bossbar-track { animation: stagger 0.32s ease-out; }
.bossbar.phase .bossbar-track { animation: phasehit 0.5s ease-out; }
@keyframes stagger { 0%, 100% { transform: none; } 15% { transform: translateX(-6px); box-shadow: 0 0 0 2px #fff, 0 0 22px #fff; } 35% { transform: translateX(5px); } 55% { transform: translateX(-3px); } 75% { transform: translateX(2px); } }
@keyframes phasehit { 0% { box-shadow: 0 0 0 2px #ff4d6d, 0 0 26px #ff4d6d; } 100% { box-shadow: none; } }
/* The boss's clock: a thin gold line under the bar that drains with the bars left in its section (its Master
   Tape is a race). It reddens through the last quarter. */
.bossbar-clock { height: 2px; margin-top: 3px; background: rgba(255, 255, 255, 0.08); border-radius: 1px; overflow: hidden; }
.bossbar-clock i { display: block; height: 100%; background: var(--gold); transform-origin: left center; transition: transform 0.12s linear, background 0.3s; box-shadow: 0 0 6px var(--gold); }
.bossbar-clock.late i { background: #ff7a8a; box-shadow: 0 0 6px #ff7a8a; }
.fightnote { position: absolute; top: calc(var(--safe-t) + 86px); left: 16px; right: 16px; text-align: center; opacity: 0; font-family: var(--f-display); font-size: 14px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; text-shadow: 0 2px 10px #000; }
.fightnote.show { animation: banner 1.6s ease-out forwards; }

/* Banners: section names, remix names (gold) and the Encore. One title, no sub line. */
.banner { position: absolute; left: 16px; right: 16px; top: 26%; text-align: center; opacity: 0; }
.banner.show { animation: banner 1.8s ease-out forwards; }
.banner-title { font-family: var(--f-display); font-size: clamp(24px, 4.5vw, 44px); font-weight: 800; letter-spacing: 0.03em; text-transform: uppercase; text-wrap: balance; text-shadow: 0 4px 30px rgba(0, 0, 0, 0.7); }
.banner.gold .banner-title { color: var(--gold); letter-spacing: 0.08em; text-shadow: 0 0 24px rgba(255, 209, 102, 0.55), 0 4px 30px rgba(0, 0, 0, 0.7); }
.banner.gold.show { animation: bannergold 1.9s ease-out forwards; }
@keyframes banner { 0% { opacity: 0; transform: translateY(10px); } 10% { opacity: 1; transform: none; } 72% { opacity: 1; } 100% { opacity: 0; } }
@keyframes bannergold { 0% { opacity: 0; transform: scale(1.35); } 12% { opacity: 1; transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: scale(1.04); } }

/* The genre stamps once over the mixer when it changes. */
.stamp { position: absolute; left: 50%; bottom: calc(var(--safe-b) + 84px); transform: translateX(-50%); opacity: 0; white-space: nowrap; font: 800 15px/1 var(--f-display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--text); text-shadow: 0 2px 14px #000; }
.stamp.show { animation: stamp 1.5s ease-out forwards; }
@keyframes stamp { 0% { opacity: 0; transform: translateX(-50%) scale(1.6) rotate(-4deg); } 14% { opacity: 1; transform: translateX(-50%) scale(1) rotate(-2deg); } 75% { opacity: 1; } 100% { opacity: 0; transform: translateX(-50%) scale(1) rotate(-2deg); } }

/* How to move, for the first runs: a device glyph under the player. */
.hint { position: absolute; left: 50%; top: calc(50% + 44px); width: 40px; height: 40px; margin-left: -20px; color: rgba(243, 238, 255, 0.8); animation: hintbob 1s ease-in-out infinite alternate; filter: drop-shadow(0 2px 6px #000); }
@keyframes hintbob { from { transform: translateY(0); opacity: 0.55; } to { transform: translateY(4px); opacity: 1; } }

/* White Noise getting louder: one static flash (only with screen flashes on). */
.hud-flash { position: absolute; inset: 0; opacity: 0; background: repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.16) 0 1px, transparent 1px 3px), rgba(255, 255, 255, 0.12); }
.hud-flash.show { animation: staticflash 0.35s ease-out; }
@keyframes staticflash { 0% { opacity: 1; } 100% { opacity: 0; } }

/* The mixer: socket LEDs, six strips (glyph, activity meter, level pips; the style as a top edge) and the
   pedalboard. Names are in tooltips (for a mouse, below) and on the pause sheet. */
.hud-bottom {
  position: absolute; left: 16px; right: 16px; bottom: calc(var(--safe-b) + 12px);
  display: flex; align-items: flex-end; justify-content: center; gap: 10px;
}
.mixwrap { display: flex; align-items: stretch; gap: 6px; min-width: 0; }
.leds { display: grid; align-content: center; gap: 4px; padding: 0 2px; }
.leds i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255, 255, 255, 0.1); }
.leds i.on { background: #fff; box-shadow: 0 0 6px #fff; }
.leds i.free { background: transparent; border: 1.5px solid #fff; animation: ledfree 0.9s ease-in-out infinite alternate; }
@keyframes ledfree { from { opacity: 0.35; } to { opacity: 1; } }
.mixer { display: grid; grid-template-columns: repeat(6, 52px); gap: 5px; }
.strip {
  position: relative; display: grid; grid-template-columns: 4px minmax(0, 1fr); grid-template-rows: 1fr auto; column-gap: 5px; row-gap: 4px;
  height: 54px; padding: 6px 6px 6px 5px; background: rgba(18, 14, 30, 0.86); border: 1px solid var(--line); border-top: 2px solid var(--s, var(--line)); border-radius: 4px;
  transition: transform 0.15s ease-out, opacity 0.25s, border-color 0.15s, box-shadow 0.15s;
}
.strip-meter { grid-row: 1 / span 2; position: relative; overflow: hidden; border-radius: 2px; background: rgba(255, 255, 255, 0.07); }
.strip-meter i { position: absolute; inset: 0; background: var(--c); transform-origin: bottom center; transform: scaleY(0); box-shadow: 0 0 8px var(--c); }
.strip-glyph { position: relative; justify-self: center; align-self: center; width: 24px; height: 24px; color: var(--c); }
.strip-glyph > span { position: absolute; inset: 0; transition: opacity 0.2s; }
.g-ghost { opacity: 0; }
.strip-pips { grid-column: 2; display: flex; justify-content: center; gap: 2px; }
.strip-pips i { width: 6px; height: 3px; border-radius: 1px; background: rgba(255, 255, 255, 0.14); }
.strip-pips i.on { background: var(--c); }
.strip.empty { opacity: 0.55; border-top-color: var(--line); }
.strip.empty .strip-glyph { width: 18px; height: 18px; color: var(--c); }
.strip.locked { opacity: 0.28; border-style: dashed; }
.strip.locked .strip-glyph { color: var(--dim); }
.strip.rest { opacity: 0.42; }
.strip.soft { opacity: 0.72; }
/* A remixed channel: its glyph sits in a spinning gold disc, its pips go gold. */
.strip.remix { border-color: color-mix(in srgb, var(--gold) 55%, var(--line)); border-top-color: var(--gold); }
.strip.remix .strip-glyph::before { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 1.5px dashed var(--gold); background: radial-gradient(circle, rgba(255, 209, 102, 0.18), transparent 70%); animation: spin 3s linear infinite; }
.strip.remix .strip-pips i.on { background: var(--gold); box-shadow: 0 0 5px var(--gold); }
/* A remix queued on this channel waits for its 4-bar line: the strip breathes gold until it lands. */
.strip.queued { border-color: var(--gold); animation: stripqueued 0.5s ease-in-out infinite alternate; }
@keyframes stripqueued { from { box-shadow: 0 0 0 0 rgba(255, 209, 102, 0); } to { box-shadow: 0 0 14px -2px var(--gold); } }
/* Banked Master Tapes: a gold reel each, by the mixer. */
.tapes { display: grid; align-content: center; gap: 3px; color: var(--gold); }
.tapes svg { width: 20px; height: 20px; filter: drop-shadow(0 0 5px rgba(255, 209, 102, 0.6)); }
.tapes.pop { animation: tapepop 0.6s ease-out; }
@keyframes tapepop { 0% { transform: scale(1.6); filter: brightness(2); } 100% { transform: none; } }
/* Moments: a sound joins (pop), a chemistry tier rises (flash in the style color). */
.strip.pop { animation: strippop 0.5s ease-out; }
.strip.pop .strip-glyph { animation: glyphflash 0.5s ease-out; }
@keyframes strippop { 0% { transform: scale(1); } 25% { transform: scale(1.22); border-color: var(--c); box-shadow: 0 0 22px var(--c); } 100% { transform: scale(1); } }
@keyframes glyphflash { 0%, 30% { color: #fff; filter: drop-shadow(0 0 6px var(--c)); } 100% { color: var(--c); } }
.strip.tierflash { animation: tierflash 0.6s ease-out; }
@keyframes tierflash { 0%, 40% { border-color: var(--s); box-shadow: 0 0 0 1px var(--s), 0 0 24px var(--s); background: color-mix(in srgb, var(--s) 22%, rgba(18, 14, 30, 0.86)); } 100% { box-shadow: none; } }
/* Where the focused card plugs in: the strip lifts and glows, the card's glyph ghosts in. */
.strip.target, .pedal.target { transform: translateY(-8px); opacity: 1; border-color: var(--tc); box-shadow: 0 0 0 1px var(--tc), 0 10px 26px -6px var(--tc); }
.strip.target .g-ghost, .pedal.target .g-ghost { opacity: 0.9; color: var(--tc); animation: ghost 0.9s ease-in-out infinite alternate; }
.strip.target.empty .g-cur, .strip.target.swap .g-cur, .pedal.target.empty .pedal-glyph { opacity: 0; }
.strip.target.empty .strip-glyph { width: 24px; height: 24px; }
.strip.target.up .g-ghost, .pedal.target.up .g-ghost { display: none; }
.strip.target.up .g-cur { animation: ghost 0.45s ease-in-out infinite alternate; }
@keyframes ghost { from { opacity: 0.45; } to { opacity: 1; } }

.pedalboard { display: grid; grid-template-columns: repeat(2, 38px); grid-auto-rows: 25px; gap: 4px; }
.pedal { position: relative; display: grid; place-items: center; align-content: center; gap: 2px; border-radius: 4px; border: 1px solid var(--line); background: rgba(18, 14, 30, 0.86); color: var(--c); transition: transform 0.15s ease-out, border-color 0.15s, box-shadow 0.15s; }
.pedal:not(.empty) { border-color: color-mix(in srgb, var(--c) 60%, var(--line)); }
.pedal.empty { border-style: dashed; }
.pedal-glyph { display: block; width: 15px; height: 15px; }
.pedal-glyph:empty { display: none; }
.pedal .g-ghost { position: absolute; left: 50%; top: 3px; width: 15px; height: 15px; margin-left: -7.5px; }
.pedal-pips { display: flex; gap: 2px; }
.pedal-pips i { width: 5px; height: 2px; background: rgba(255, 255, 255, 0.2); }
.pedal-pips i.on { background: var(--c); }
/* The HUD lets the pointer through to the canvas. A mouse hovering a strip or pedal gets its tooltip; touches
   still reach the canvas (the stick), so this is off once the last input was touch. */
@media (hover: hover) {
  body:not([data-input=touch]) #hud :is(.strip, .pedal) { pointer-events: auto; }
  #hud :is(.strip, .pedal) { touch-action: none; }
}

#stick { position: fixed; left: 0; top: 0; width: 112px; height: 112px; border-radius: 50%; border: 2px solid rgba(243, 238, 255, 0.28); background: rgba(243, 238, 255, 0.04); pointer-events: none; z-index: 2; }
#stick span { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(243, 238, 255, 0.34); }

/* ------------------------------------------------------------------ screens */

#screens {
  position: absolute; inset: 0; z-index: 3; overflow-y: auto; overscroll-behavior: contain;
  padding: calc(var(--safe-t) + 16px) 16px calc(var(--safe-b) + 16px);
  background: radial-gradient(ellipse at 50% 40%, rgba(13, 10, 23, 0.35), rgba(13, 10, 23, 0.82));
  -webkit-user-select: none; user-select: none;
}
#screens:has(.screen-pause, .screen-end, .screen-howto, .screen-settings) { background: rgba(11, 8, 20, 0.84); }
/* A level-up keeps the stage in view: a light backdrop, the cards up top, the mixer bright under them. */
#screens:has(.screen-levelup) { background: radial-gradient(ellipse at 50% 38%, rgba(11, 8, 20, 0.62), rgba(11, 8, 20, 0.42) 75%); }
#screens:has(.has-remix) { background: radial-gradient(ellipse at 50% 34%, rgba(255, 209, 102, 0.12), rgba(11, 8, 20, 0.55) 60%, rgba(11, 8, 20, 0.42)); }
body[data-screen] #hud .hud-top, body[data-screen] #hud .banner, body[data-screen] #hud .stamp, body[data-screen] #hud .hint, body[data-screen] #hud .pausebtn, body[data-screen] #hud .dropbtn, body[data-screen] #hud .bossbar, body[data-screen] #hud .fightnote { visibility: hidden; }
@media (min-width: 761px) and (min-height: 521px) {
  body[data-screen=levelup] #hud { z-index: 4; }
}
.screen { min-height: 100%; display: grid; place-items: center; }
.screen-levelup, .screen-pause, .screen-end, .screen-howto, .screen-settings { animation: screenIn 0.18s ease-out; }
@keyframes screenIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

h2 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(22px, 3.6vw, 32px); line-height: 1.15; text-wrap: balance; }
.kicker { margin: 0 0 8px; font-family: var(--f-mono); font-size: 11.5px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }
.sub { margin: 8px 0 0; color: var(--muted); font-size: 14.5px; line-height: 1.5; max-width: 60ch; }

.btn {
  min-height: 44px; padding: 12px 20px; font: 600 15px/1 var(--f-body); color: var(--text);
  background: rgba(22, 17, 37, 0.8); border: 1px solid var(--line-2); border-radius: 4px; cursor: pointer;
  transition: border-color 0.12s, background 0.12s, transform 0.12s, opacity 0.15s;
}
.btn:hover { border-color: var(--muted); }
.btn:active { transform: translateY(1px); }
.btn:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
.btn-primary { background: var(--text); color: var(--ink); border-color: var(--text); }
.btn-primary:hover { background: #ffffff; border-color: #ffffff; }
.btn-ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn-ghost:hover { color: var(--text); border-color: var(--line); }
.btn[disabled] { opacity: 0.4; cursor: default; }
.muted { color: var(--dim); font-weight: 400; }
body[data-input=pad] #screens :is(.btn, .ibtn, input):focus { outline: 2px solid var(--text); outline-offset: 2px; }

/* Icon buttons (reroll, banish, skip, info, Gain): a glyph, remaining-use dots under it, a tiny key cap. */
.ibtn {
  position: relative; display: grid; place-items: center; width: 52px; height: 48px; padding: 9px 13px 13px; color: var(--muted);
  background: rgba(22, 17, 37, 0.72); border: 1px solid var(--line); border-radius: 6px; cursor: pointer;
  transition: color 0.12s, border-color 0.12s, background 0.12s, transform 0.12s, opacity 0.15s;
}
.ibtn:hover { color: var(--text); border-color: var(--line-2); }
.ibtn:active { transform: translateY(1px); }
.ibtn:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
.ibtn[disabled] { opacity: 0.35; cursor: default; }
.ibtn[aria-pressed="true"] { color: var(--text); border-color: var(--text); background: rgba(243, 238, 255, 0.08); }
.ibtn[data-act=banish][aria-pressed="true"] { color: var(--bad); border-color: var(--bad); background: rgba(255, 122, 138, 0.1); }
.ibtn > svg { width: 22px; height: 22px; }
.ibtn kbd { position: absolute; top: -7px; right: -6px; }
.ibtn .uses { position: absolute; left: 0; right: 0; bottom: 5px; display: flex; justify-content: center; gap: 3px; }
.uses i { width: 4px; height: 4px; border-radius: 50%; background: rgba(255, 255, 255, 0.16); }
.uses i.on { background: currentColor; }
.ibtn .mini { position: absolute; right: 7px; bottom: 5px; width: 12px; height: 12px; color: #fff; }
.ibtn-sm { width: 40px; height: 40px; padding: 9px; }
.ibtn.flip > svg { transform: scaleX(-1); }

/* Title: the logo is a step sequencer. A playhead lights each letter in turn, one 16th note apart. */
.title-wrap { display: grid; justify-items: center; text-align: center; gap: 18px; }
.logo { display: grid; justify-items: center; line-height: 0.9; }
.logo-row { display: flex; gap: 0.02em; font-family: var(--f-display); font-weight: 800; font-size: clamp(46px, 12vw, 128px); letter-spacing: 0.01em; }
.logo-row-b { font-size: clamp(26px, 6.7vw, 72px); letter-spacing: 0.06em; }
.logo-row span { color: var(--text); animation: step 2s steps(1, end) infinite; animation-delay: calc(var(--i) * 0.125s); }
.logo-row span:nth-child(6n + 1) { --lc: var(--beat); }
.logo-row span:nth-child(6n + 2) { --lc: var(--perc); }
.logo-row span:nth-child(6n + 3) { --lc: var(--bass); }
.logo-row span:nth-child(6n + 4) { --lc: var(--chords); }
.logo-row span:nth-child(6n + 5) { --lc: var(--lead); }
.logo-row span:nth-child(6n + 6) { --lc: var(--arp); }
@keyframes step { 0% { color: var(--lc); text-shadow: 0 0 28px var(--lc); } 6.25% { color: var(--text); text-shadow: none; } }
.tagline { margin: 0; font-size: clamp(16px, 2.2vw, 20px); color: var(--text); max-width: 34ch; text-wrap: balance; }
.title-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 6px; }
.best { margin: 0; font-family: var(--f-mono); font-size: 12px; color: var(--muted); letter-spacing: 0.04em; }
.hint-line { margin: 0; font-family: var(--f-mono); font-size: 11px; color: var(--dim); letter-spacing: 0.14em; text-transform: uppercase; }

/* Panels */
.panel { width: min(520px, 100%); padding: 26px 24px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 30px 80px -30px rgba(0, 0, 0, 0.8); }
.panel-wide { width: min(780px, 100%); }
.panel-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
.panel-actions.col { flex-direction: column; }
.panel-actions.col .btn { width: 100%; }

/* How to play: one line per idea, each with its glyph, then the controls. */
.howto { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 8px; font-size: 15px; }
.howto li { display: grid; grid-template-columns: 26px minmax(0, 1fr); align-items: center; gap: 12px; }
.ht-icon { width: 24px; height: 24px; color: var(--muted); }
.keys { width: 100%; margin-top: 16px; border-collapse: collapse; font-size: 13.5px; }
.keys th, .keys td { padding: 3px 12px 3px 0; text-align: left; border-bottom: 1px solid var(--line); }
.keys thead th { font: 700 10.5px/1.4 var(--f-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.keys tbody th { font-weight: 600; }
.keys td { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.touch-note { display: none; margin: 14px 0 0; font-size: 14.5px; line-height: 1.5; color: var(--muted); }
body[data-input=touch] .keys { display: none; }
body[data-input=touch] .touch-note { display: block; }

.field { display: grid; gap: 8px; margin-top: 18px; font-size: 14px; }
.field input[type=range] { width: 100%; accent-color: var(--chords); }
.toggle { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 15px; cursor: pointer; }
.toggle input { width: 18px; height: 18px; accent-color: var(--chords); }

/* ------------------------------------------------------------------ cards
   A card is a glyph, a name and its sound: kind badge, key cap, hero glyph in the channel color, title,
   level pips, the step lane and style gems. The frame's shape is the style: Synth rounded with a cool glow,
   Live warm with grain, 8-Bit square with stepped notches, Heavy jagged and hard, Orchestra a fine double
   border; a 3 px bar along the bottom in the style color. Pedals are stomp boxes, remixes are gold. */
.cards-wrap { width: min(980px, 100%); display: grid; justify-items: center; text-align: center; align-self: center; }
.screen-levelup .cards-wrap { align-self: start; margin-top: max(0px, calc(36vh - 220px)); padding-bottom: 96px; }
.cards { width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 232px)); justify-content: center; gap: 18px; }
.row-actions { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 20px; }
.pending { display: flex; gap: 6px; margin-bottom: 14px; }
.pending i { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--text); opacity: 0.6; }
.pending i:first-child { background: var(--text); opacity: 1; box-shadow: 0 0 8px var(--text); }
/* A Master Tape's remix cards: a gold reel over them. */
.tape-mark { width: 34px; height: 34px; margin-bottom: 12px; color: var(--gold); filter: drop-shadow(0 0 10px rgba(255, 209, 102, 0.7)); }
.tape-mark svg { width: 100%; height: 100%; }
.tape-pick .cards { grid-template-columns: repeat(var(--n, 3), minmax(0, 232px)); }

.card {
  --r: 8px; --edge: color-mix(in srgb, var(--s) 40%, var(--line)); --bg: var(--panel);
  position: relative; isolation: isolate; display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 0;
  padding: 18px 16px 20px; color: var(--text); background: none; border: 0; cursor: pointer; text-align: center;
  transition: transform 0.14s ease-out, filter 0.14s, opacity 0.15s;
}
.card-frame { position: absolute; inset: 0; z-index: -1; overflow: hidden; border-radius: var(--r); clip-path: var(--clip, none); background: var(--edge); transition: background 0.14s; }
.card-frame::before { content: ""; position: absolute; inset: var(--bw, 1px); border-radius: max(0px, calc(var(--r) - 1px)); clip-path: var(--clip, none); background: var(--bg); box-shadow: var(--inner, none); }
.card-frame::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--s); }
.card:hover, .card:focus-visible, .card.focused, .card.listening, .card.auditioning { transform: translateY(-4px); outline: none; filter: drop-shadow(0 14px 22px color-mix(in srgb, var(--c) 38%, transparent)); }
.card:is(:hover, :focus-visible, .focused, .listening, .auditioning) .card-frame { background: var(--c); }
/* A level-up arms after a moment (screens.js ARM_MS): until then its cards and buttons are dimmed and ignore presses. */
.arming .card, .arming .row-actions .ibtn:not([disabled]) { opacity: 0.6; }

.card[data-style=synth] { --r: 16px; --bg: linear-gradient(180deg, color-mix(in srgb, var(--s) 10%, var(--panel)), var(--panel) 70%); --inner: inset 0 0 22px -8px color-mix(in srgb, var(--s) 70%, transparent); }
.card[data-style=synth] .card-frame { box-shadow: 0 0 18px -8px var(--s); }
.card[data-style=organic] { --r: 9px; --bg: repeating-linear-gradient(112deg, rgba(240, 184, 132, 0.05) 0 1px, transparent 1px 4px), radial-gradient(ellipse at 50% 0%, color-mix(in srgb, var(--s) 14%, transparent), transparent 70%), #1a1320; --inner: inset 0 0 0 1px rgba(240, 184, 132, 0.12), inset 0 0 26px -10px rgba(240, 184, 132, 0.6); }
.card[data-style=chip] {
  --r: 0px; --bw: 2px; --bg: repeating-linear-gradient(0deg, color-mix(in srgb, var(--s) 6%, transparent) 0 1px, transparent 1px 3px), var(--panel);
  --clip: polygon(0 8px, 4px 8px, 4px 4px, 8px 4px, 8px 0, calc(100% - 8px) 0, calc(100% - 8px) 4px, calc(100% - 4px) 4px, calc(100% - 4px) 8px, 100% 8px, 100% calc(100% - 8px), calc(100% - 4px) calc(100% - 8px), calc(100% - 4px) calc(100% - 4px), calc(100% - 8px) calc(100% - 4px), calc(100% - 8px) 100%, 8px 100%, 8px calc(100% - 4px), 4px calc(100% - 4px), 4px calc(100% - 8px), 0 calc(100% - 8px));
}
.card[data-style=heavy] {
  --r: 0px; --bw: 2px; --edge: color-mix(in srgb, var(--s) 55%, #3a3346); --bg: repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.025) 0 2px, transparent 2px 7px), linear-gradient(160deg, #241c2c, #110d17 65%);
  --clip: polygon(0 14px, 14px 0, calc(100% - 26px) 0, calc(100% - 19px) 7px, calc(100% - 12px) 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 26px 100%, 19px calc(100% - 7px), 12px 100%, 0 100%);
}
.card[data-style=orchestra] { --r: 4px; --bg: radial-gradient(ellipse at 50% 0%, color-mix(in srgb, var(--s) 10%, transparent), transparent 65%), var(--panel); --inner: inset 0 0 0 3px var(--panel), inset 0 0 0 4px color-mix(in srgb, var(--s) 55%, transparent); }
.card[data-style=pedal] { padding-bottom: 26px; --r: 14px; --bw: 2px; --edge: color-mix(in srgb, var(--c) 45%, var(--line)); --bg: radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--c) 12%, transparent), transparent 60%), #1a1528; --inner: inset 0 -10px 0 -6px rgba(0, 0, 0, 0.35); }
.card[data-style=pedal] .card-frame::after { left: 30%; right: 30%; bottom: 7px; height: 6px; border-radius: 2px; background: color-mix(in srgb, var(--c) 40%, #2a2340); }
.card[data-style=plain] .card-frame::after { display: none; }
.card[data-style=remix] { --r: 10px; --bw: 1.5px; --edge: color-mix(in srgb, var(--gold) 70%, var(--line)); --s: var(--gold); --bg: radial-gradient(ellipse at 50% 30%, rgba(255, 209, 102, 0.2), transparent 65%), linear-gradient(180deg, #2a2210, var(--panel) 70%); }
.card[data-style=remix]:is(:hover, :focus-visible, .focused, .listening, .auditioning) .card-frame { background: var(--gold); }
.card[data-style=remix]:is(:hover, :focus-visible, .focused, .listening, .auditioning) { filter: drop-shadow(0 14px 24px rgba(255, 209, 102, 0.45)); }

.card-key { position: absolute; top: 10px; right: 10px; font: 700 10px/1 var(--f-mono); color: var(--dim); border: 1px solid var(--line-2); border-radius: 3px; padding: 3px 6px; }
body[data-input=pad] .card:not(.focused) .card-key { display: none; }
body[data-input=pad] .card-key::after { content: "A"; }
.card-badge { position: absolute; top: 10px; left: 11px; display: flex; align-items: center; gap: 3px; width: 20px; height: 20px; color: var(--c); opacity: 0.85; }
.card-badge > svg { flex: 0 0 20px; }
.card-badge.swap { width: auto; }
.card-badge .from { position: relative; width: 16px; height: 16px; color: var(--muted); opacity: 0.8; }
.card-badge .from::after { content: ""; position: absolute; left: -2px; right: -2px; top: 50%; height: 1.5px; background: var(--bad); transform: rotate(-35deg); }
.card-hero { position: relative; display: grid; place-items: center; width: 66px; height: 66px; margin-top: 10px; color: var(--c); filter: drop-shadow(0 0 10px color-mix(in srgb, var(--c) 45%, transparent)); transition: transform 0.08s ease-out; }
.card-hero.hit { animation: herohit 0.14s ease-out; }
@keyframes herohit { 0% { transform: scale(1.16); filter: drop-shadow(0 0 16px var(--c)) brightness(1.5); } 100% { transform: scale(1); } }
.card-hero.vinyl { width: 84px; height: 84px; margin-top: 2px; color: var(--gold); }
.card-hero.vinyl > svg { position: relative; width: 40px; height: 40px; }
.card-hero .vdisc { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--gold); background: repeating-radial-gradient(circle, rgba(255, 209, 102, 0.1) 0 1px, transparent 1px 4px), radial-gradient(circle, #2b2312 0 34%, #0d0a10 35%); animation: spin 2.4s linear infinite; }
.card-hero .vdisc::after { content: ""; position: absolute; left: 50%; top: 4px; width: 2px; height: 14px; margin-left: -1px; background: rgba(255, 209, 102, 0.6); }
.card-title { font-family: var(--f-display); font-size: 17px; font-weight: 700; line-height: 1.15; text-wrap: balance; }
.card[data-style=remix] .card-title { color: var(--gold); letter-spacing: 0.02em; }
.pips { display: flex; justify-content: center; gap: 4px; }
.pips i { flex: 0 0 16px; height: 4px; border-radius: 1px; background: rgba(255, 255, 255, 0.12); }
.pips i.on { background: var(--c); }
.pips i.new { animation: pipnew 0.6s ease-in-out infinite alternate; }
.card[data-style=remix] .pips i.on { background: var(--gold); }
@keyframes pipnew { from { box-shadow: 0 0 0 0 var(--c); opacity: 0.6; } to { box-shadow: 0 0 8px 1px var(--c); opacity: 1; } }
.steps { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 3px; width: 100%; }
.steps.long { grid-template-columns: repeat(32, minmax(0, 1fr)); gap: 1.5px; }
.steps i { height: 9px; border-radius: 2px; background: rgba(255, 255, 255, 0.06); transition: background 0.05s; }
.steps.long i { height: 7px; border-radius: 1px; }
.steps i.beat { background: rgba(255, 255, 255, 0.11); }
.steps i.on { background: var(--c); opacity: calc(0.45 + var(--v) * 0.55); }
.steps i.new { box-shadow: inset 0 0 0 1.5px #fff; }
.steps i.now { background: rgba(255, 255, 255, 0.4); }
.steps i.on.now { background: #fff; opacity: 1; box-shadow: 0 0 8px var(--c); }
.card[data-style=remix] .steps i.on { background: var(--gold); }

/* Style gems: one dot per sound of the style (larger at its tiers); a sparkle for a tier gained, a crack for one lost. */
.card-foot { display: flex; justify-content: center; align-items: center; gap: 10px; min-height: 12px; }
.gems { display: inline-flex; align-items: center; gap: 3px; }
.gems i { width: 6px; height: 6px; border-radius: 50%; background: color-mix(in srgb, var(--s) 55%, transparent); }
.gems i.big { width: 10px; height: 10px; transform: rotate(45deg); border-radius: 2px; }
.gems i.new { background: var(--s); box-shadow: 0 0 0 1.5px var(--panel), 0 0 0 2.5px var(--s); }
.gems i.up { animation: sparkle 0.9s ease-in-out infinite alternate; }
.gems i.gone { position: relative; background: transparent; border: 1.5px solid var(--s); opacity: 0.7; }
.gems i.gone::after { content: ""; position: absolute; left: -3px; right: -3px; top: 50%; height: 1.5px; margin-top: -0.75px; background: var(--muted); transform: rotate(-45deg); }
.gems i.gone.down { border-color: var(--bad); }
.gems i.gone.down::after { background: var(--bad); }
.gems.fusion i { --s: #fff; background: conic-gradient(var(--beat), var(--perc), var(--bass), var(--chords), var(--lead), var(--arp), var(--beat)); }
@keyframes sparkle { from { box-shadow: 0 0 0 1.5px var(--panel), 0 0 0 2.5px var(--s), 0 0 4px var(--s); } to { box-shadow: 0 0 0 1.5px var(--panel), 0 0 0 2.5px var(--s), 0 0 14px 3px var(--s); } }

/* The info layer: every sentence a card used to show, on demand (I, pad Y or the (i) button). */
.card-info { display: none; width: 100%; padding-top: 9px; border-top: 1px solid var(--line); text-align: left; font-size: 12.5px; line-height: 1.4; color: var(--muted); }
.card-info span { display: block; }
.card-info span:first-child { color: var(--text); }
.card-info span + span { margin-top: 4px; }
#screens.info .card-info { display: block; }

/* Banish mode: the cards that can go get a red frame, the rest step back. */
.cards.banishing .card:not(.no-ban) .card-frame { background: var(--bad); }
.cards.banishing .card:not(.no-ban):is(:hover, :focus-visible, .focused) { filter: drop-shadow(0 14px 22px rgba(255, 122, 138, 0.45)); }
.cards.banishing .card.no-ban { filter: grayscale(0.7) brightness(0.5); }

/* First sound: the featured cards take turns playing; unlocked sounds are glyph chips with a style edge,
   the rest dim silhouettes with a lock. */
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 760px; margin-top: 22px; }
.card.chip { display: grid; place-items: center; width: 42px; height: 42px; padding: 9px; gap: 0; border-radius: 6px; background: rgba(22, 17, 37, 0.8); border: 1px solid var(--line); border-bottom: 3px solid var(--s); color: var(--c); filter: none; }
.card.chip:is(:hover, :focus-visible, .focused, .listening, .auditioning) { border-color: var(--c); border-bottom-color: var(--s); transform: translateY(-2px); filter: drop-shadow(0 6px 10px color-mix(in srgb, var(--c) 35%, transparent)); }
.chip.locked { position: relative; display: grid; place-items: center; width: 42px; height: 42px; padding: 10px; border-radius: 6px; border: 1px dashed var(--line); color: var(--c); opacity: 0.22; filter: grayscale(0.6); }
.chip.locked i { position: absolute; right: -3px; bottom: -3px; width: 14px; height: 14px; padding: 1px; color: var(--text); background: var(--ink); border-radius: 3px; }
/* The Gain stepper: "Gain 2 ◂ ▸ ×1.2". Its name and modifiers are in the info layer. */
.gain { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; margin-top: 18px; font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.gain-name b { color: var(--text); font-size: 15px; }
.gain-score { min-width: 4ch; color: var(--gold); font-weight: 700; }
.gain-mods { display: none; margin: 6px 0 0; max-width: 64ch; font-size: 12.5px; line-height: 1.45; color: var(--muted); }
#screens.info .gain-mods { display: block; }

/* End screen */
.end-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 18px; }
.end-stats div { display: grid; gap: 4px; padding: 12px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; }
.end-stats b { font-family: var(--f-display); font-size: 20px; font-variant-numeric: tabular-nums; }
.end-stats span { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.end-song { margin-top: 16px; }
.end-song .songmap { width: 100%; height: 10px; margin: 34px 0 22px; }   /* room for the marker labels */
.end-song p { margin: 6px 0 0; font-size: 14.5px; line-height: 1.45; color: var(--muted); }
.end-song p b { color: var(--text); }
.end-genre { margin: 16px 0 0; font-size: 15px; color: var(--muted); }
.end-genre b { color: var(--text); font-family: var(--f-display); }
.end-rows { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 6px; }
.end-rows li { display: grid; grid-template-columns: 24px minmax(0, 150px) minmax(0, 1fr) 76px; align-items: center; gap: 10px; font-size: 13.5px; }
.end-rows li.retired { opacity: 0.55; }
.er-icon { width: 22px; height: 22px; color: var(--c); }
.er-name { display: grid; line-height: 1.25; min-width: 0; }
.er-name small { font-family: var(--f-mono); font-size: 10px; color: var(--muted); letter-spacing: 0.06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.er-bar { height: 8px; background: rgba(255, 255, 255, 0.06); border-radius: 2px; overflow: hidden; }
.er-bar i { display: block; height: 100%; background: var(--c); transform-origin: left center; }
.er-num { text-align: right; font-family: var(--f-mono); font-size: 12px; font-variant-numeric: tabular-nums; }
.end-pedals { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 0; }
.end-pedal { display: grid; justify-items: center; gap: 3px; width: 34px; padding: 5px 0; color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 45%, var(--line)); border-radius: 4px; }
.end-pedal > svg { width: 18px; height: 18px; }
.pips-sm { display: inline-flex; gap: 2px; }
.pips-sm i { width: 6px; height: 3px; border-radius: 1px; background: rgba(255, 255, 255, 0.16); }
.pips-sm i.on { background: var(--c); }
.end-notes { margin-top: 16px; padding: 10px 14px; border: 1px solid color-mix(in srgb, var(--gold) 45%, var(--line)); border-radius: 4px; background: color-mix(in srgb, var(--gold) 7%, var(--panel-2)); }
.end-notes .kicker { margin: 0 0 4px; color: var(--gold); }
.end-notes ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; font-size: 14px; line-height: 1.4; }
.end-notes .more { color: var(--muted); }
.end-unsaved { margin: 16px 0 0; font-size: 13.5px; color: var(--dim); }
.end .now-playing:empty { display: none; }
.end [data-act=listen] { min-width: 12em; }   /* Listen and Stop keep one width, so the buttons stay put */

/* Pause: the home of the run's details. */
.pause.panel { width: min(900px, 100%); padding: 22px 24px; }
.pause-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.pause-time { font: 700 18px/1 var(--f-display); font-variant-numeric: tabular-nums; color: var(--muted); }
.screen-pause .songmap { width: 100%; height: 8px; margin: 12px 0 10px; }
.pause-meta { margin: 0; font-family: var(--f-mono); font-size: 12px; color: var(--muted); letter-spacing: 0.03em; }
.pause-meta b { color: var(--text); font-family: var(--f-display); font-size: 13px; letter-spacing: 0; }
.pause-cols { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; margin-top: 16px; }
.pause-band { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.pause-band li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto 64px; align-items: center; gap: 10px; padding: 6px 9px; background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid var(--s, var(--line)); border-radius: 4px; font-size: 13.5px; }
.pause-band li.empty { opacity: 0.5; border-left-color: var(--line); }
.pause-band li.remix { border-color: color-mix(in srgb, var(--gold) 45%, var(--line)); border-left-color: var(--gold); }
.pause-band li.remix .pb-name { color: var(--gold); }
.pause-band li.remix .pips-sm i.on { background: var(--gold); }
.pb-g { width: 20px; height: 20px; color: var(--c); }
.pb-name { display: grid; min-width: 0; font-weight: 600; line-height: 1.25; }
.pb-name small { font: 400 11px/1.35 var(--f-body); color: var(--muted); }
.pb-name em { font-style: normal; color: var(--s); font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.06em; }
.pb-dmg { text-align: right; font-family: var(--f-mono); font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); }
.pause-pedals { margin-top: 8px; }
.pause-pedals li { grid-template-columns: 22px minmax(0, 1fr) auto; border-left-color: var(--c); }
.screen-pause .seqgrid { display: block; width: 100%; height: 96px; padding: 6px; background: rgba(13, 10, 23, 0.72); border: 1px solid var(--line); border-radius: 4px; }
.rules { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 4px; }
.rules > li { padding: 6px 9px; background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid var(--s); border-radius: 4px; font-size: 12px; color: var(--muted); }
.rules > li:not(.on) { opacity: 0.6; }
.rules b { display: flex; justify-content: space-between; color: var(--s); font: 700 11px/1.4 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; }
.rules b span { color: var(--text); }
.rules p { margin: 2px 0 0; line-height: 1.35; }
.rules ol { list-style: none; margin: 3px 0 0; padding: 0; display: grid; gap: 1px; }
.rules ol li { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 4px; line-height: 1.35; }
.rules ol li i { font-style: normal; font-family: var(--f-mono); color: var(--dim); }
.rules ol li.on { color: var(--text); }
.rules ol li.on i { color: var(--s); }

/* Discography: record sleeves, the remix crate and the liner notes, one page at a time. */
#screens:has(.screen-disco) { background: rgba(11, 8, 20, 0.84); }
.screen-disco { animation: screenIn 0.18s ease-out; }
.tabs { display: flex; gap: 4px; margin-top: 16px; border-bottom: 1px solid var(--line); }
.tab { min-height: 44px; padding: 10px 14px; font: 600 14.5px/1 var(--f-body); color: var(--muted); background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; }
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--gold); }
.tab:focus-visible, body[data-input=pad] #screens .tab:focus { outline: 2px solid var(--text); outline-offset: -2px; }
.now-playing { min-height: 18px; margin: 10px 0 0; font-family: var(--f-mono); font-size: 12px; color: var(--gold); }
.disco-label { margin: 16px 0 6px; }
.sleeves { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 8px; margin-top: 4px; }
.sleeve {
  display: grid; grid-template-columns: 40px minmax(0, 1fr); column-gap: 10px; align-items: center; min-height: 60px; padding: 8px 10px;
  text-align: left; color: var(--text); background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 6px;
}
button.sleeve { font: inherit; cursor: pointer; }
button.sleeve:hover, button.sleeve:focus-visible, body[data-input=pad] #screens .sleeve:focus { border-color: var(--text); outline: none; }
.sleeve b { font-size: 13.5px; line-height: 1.2; overflow-wrap: break-word; }
.sleeve span { grid-column: 2; font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); }
.sleeve em { font-style: normal; color: var(--gold); border: 1px solid color-mix(in srgb, var(--gold) 50%, transparent); border-radius: 3px; padding: 0 4px; }
.sleeve.demo { border-style: dashed; }
.sleeve.empty { opacity: 0.42; }
.sleeve.playing { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
.disc {
  grid-row: span 2; width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--line-2);
  background: radial-gradient(circle, var(--line-2) 0 16%, #0b0814 17% 100%), conic-gradient(transparent 0 15%, rgba(255, 255, 255, 0.14) 20%, transparent 25% 65%, rgba(255, 255, 255, 0.14) 70%, transparent 75%);
  background-blend-mode: screen;
}
.sleeve.gold .disc { border-color: var(--gold); box-shadow: 0 0 12px -3px var(--gold); }
.sleeve.playing .disc { animation: spin 1.8s linear infinite; }
@keyframes spin { to { transform: rotate(1turn); } }
/* The remix crate: a tile per sound, its glyph + its pedal's glyph; found remixes gold with their name. */
.rx-grid { display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); gap: 6px; }
.rx-head { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); text-align: center; }
.rx { display: grid; justify-items: center; align-content: center; gap: 3px; min-width: 0; min-height: 52px; padding: 7px 6px; background: var(--panel-2); border: 1px dashed var(--line-2); border-bottom: 3px solid var(--c); border-radius: 4px; }
.rx.none { visibility: hidden; }
.rx-g { display: flex; align-items: center; gap: 4px; }
.rx-g > svg { width: 22px; height: 22px; color: var(--c); opacity: 0.5; }
.rx b { font-family: var(--f-display); font-size: 11.5px; color: var(--gold); text-align: center; overflow-wrap: break-word; }
.rx.found { border-style: solid; border-color: color-mix(in srgb, var(--gold) 55%, var(--line)); border-bottom-color: var(--c); background: linear-gradient(180deg, color-mix(in srgb, var(--gold) 12%, var(--panel-2)), var(--panel-2)); }
.rx.found .rx-g > svg { opacity: 1; }
.notes { list-style: none; margin: 14px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 6px; }
.notes li { display: grid; grid-template-columns: 20px minmax(0, 1fr); column-gap: 9px; align-items: center; padding: 7px 10px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; font-size: 13px; line-height: 1.35; color: var(--muted); }
.notes i { grid-row: span 2; display: grid; place-items: center; width: 20px; height: 20px; font-style: normal; font-size: 12px; font-weight: 700; color: var(--ink); border: 1.5px solid var(--line-2); border-radius: 50%; }
.notes li.done { color: var(--text); }
.notes li.done i { background: var(--good); border-color: var(--good); }
.notes b { color: var(--text); }
.notes small { font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); }

/* ------------------------------------------------------------------ small screens */

@media (max-width: 760px) {
  .hud-top { grid-template-columns: minmax(0, 1fr); gap: 8px; right: 62px; }
  body:not([data-input=touch]) .hud-top { right: 16px; }
  .hud-bars { width: 100%; }
  .songwrap .songmap { width: 100%; margin: 0; }
  .bossbar { top: calc(var(--safe-t) + 54px); }
  .fightnote { top: calc(var(--safe-t) + 96px); }
  .hud-bottom { left: 8px; right: 8px; gap: 6px; justify-content: space-between; }
  .mixwrap { flex: 1 1 auto; }
  .leds { display: none; }
  .mixer { flex: 1 1 auto; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; }
  .strip { height: 46px; padding: 5px 4px 5px 3px; column-gap: 3px; }
  .strip-glyph { width: 20px; height: 20px; }
  .strip-pips i { width: 4px; }
  .pedalboard { grid-template-columns: repeat(2, 30px); grid-auto-rows: 21px; gap: 3px; }
  .pedal-glyph { width: 12px; height: 12px; }
  .stamp { bottom: calc(var(--safe-b) + 72px); font-size: 13px; }
  .dropbtn { bottom: calc(var(--safe-b) + 76px); }

  .screen-levelup .cards-wrap, .cards-wrap { margin-top: 0; padding-bottom: 0; }
  .cards, .tape-pick .cards { grid-template-columns: minmax(0, 1fr); max-width: 440px; gap: 10px; }
  .card {
    display: grid; grid-template-columns: 58px minmax(0, 1fr); grid-template-areas: "hero title" "hero pips" "hero steps" "hero foot" "info info";
    justify-items: start; align-items: center; column-gap: 14px; row-gap: 5px; padding: 14px 16px 14px 14px; text-align: left; min-height: 104px;
  }
  .card-hero { grid-area: hero; width: 52px; height: 52px; margin: 0; justify-self: center; }
  .card-hero.vinyl { width: 58px; height: 58px; }
  .card-hero.vinyl > svg { width: 28px; height: 28px; }
  .card-title { grid-area: title; font-size: 15.5px; padding-right: 26px; }
  .card .pips { grid-area: pips; }
  .pips i { flex-basis: 14px; }
  .card .steps { grid-area: steps; }
  .steps i { height: 7px; }
  .card-foot { grid-area: foot; min-height: 0; }
  .card-foot:empty { display: none; }
  .card-info { grid-area: info; }
  .card-badge { top: 9px; left: 9px; width: 16px; height: 16px; }
  .card-badge > svg { flex-basis: 16px; }
  .card-badge.swap .from { display: none; }
  .row-actions { margin-top: 14px; gap: 8px; }
  .card.chip, .chip.locked { display: grid; grid-template-columns: none; grid-template-areas: none; min-height: 0; width: 38px; height: 38px; padding: 8px; }
  .chips { gap: 5px; margin-top: 16px; }
  .end-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .end-rows li { grid-template-columns: 22px minmax(0, 1fr) 64px; }
  .er-bar { display: none; }
  .screen-howto .panel { padding: 20px 16px; }
  .howto { gap: 9px; font-size: 14px; }
  .title-actions { display: grid; grid-template-columns: 1fr 1fr; width: min(100%, 340px); }
  .pause.panel { padding: 18px 14px; }
  .pause-cols { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .pause-band li { grid-template-columns: 20px minmax(0, 1fr) auto 52px; gap: 8px; padding: 5px 7px; font-size: 12.5px; }
  .panel-actions .btn { padding: 12px 14px; }
  .disco.panel { padding: 20px 14px; }
  .tab { padding: 10px; }
  .sleeves { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .sleeve { grid-template-columns: 32px minmax(0, 1fr); column-gap: 8px; padding: 7px 8px; }
  .disc { width: 32px; height: 32px; }
  .rx { padding: 5px 3px; min-height: 44px; }
  .rx-g > svg { width: 16px; height: 16px; }
  .rx b { font-size: 9.5px; }
  .rx-head { font-size: 8.5px; letter-spacing: 0.04em; }
  .notes { grid-template-columns: minmax(0, 1fr); }
}

/* Landscape phones: compact cards, so a whole card screen fits without scrolling. */
@media (max-height: 520px) {
  .screen-levelup .cards-wrap, .cards-wrap { margin-top: 0; padding-bottom: 0; }
  .cards { gap: 10px; }
  .card { padding: 9px 12px 12px; gap: 5px; }
  .card-hero { width: 40px; height: 40px; margin-top: 4px; }
  .card-hero.vinyl { width: 52px; height: 52px; }
  .card-hero.vinyl > svg { width: 26px; height: 26px; }
  .card-title { font-size: 14.5px; }
  .steps i { height: 6px; }
  .row-actions { margin-top: 8px; }
  .ibtn { height: 40px; padding-top: 6px; padding-bottom: 12px; }
  .chips { margin-top: 10px; }
  .panel-actions.col { display: grid; grid-template-columns: 1fr 1fr; }
  .banner { top: calc(var(--safe-t) + 110px); }
  .banner-title { font-size: 24px; }
  .end.panel { padding: 16px 20px; }
  .end-stats { margin-top: 12px; }
  .end-stats div { padding: 8px 10px; }
  .end-stats b { font-size: 17px; }
  .end-notes, .end-song, .end-genre { margin-top: 12px; }
  .end-song .songmap { margin: 28px 0 14px; }
  .end-rows { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 20px; }
  .end .panel-actions { margin-top: 14px; }
  .disco.panel { padding: 16px 18px; }
  .disco h2 { font-size: 20px; }
  .tabs { margin-top: 8px; }
  .sleeves { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .sleeve { min-height: 48px; padding: 5px 8px; }
  .notes { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 8px; }
  .notes li { padding: 5px 8px; font-size: 12px; }
  .strip { height: 44px; }
}

@media (prefers-reduced-motion: reduce) {
  .logo-row span { animation: none; }
  .dropbtn, .hp.low, .leds i.free, .pips i.new, .gems i.up, .hint, .songwrap .songmap b.open { animation: none; }
  .banner.show, .banner.gold.show { animation-duration: 2.2s; }
  .card, .btn, .ibtn, .strip { transition: none; }
  .sleeve.playing .disc, .card-hero .vdisc, .strip.remix .strip-glyph::before, .strip.queued, .tapes.pop { animation: none; }
}
